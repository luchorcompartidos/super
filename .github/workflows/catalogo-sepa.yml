name: Catálogo SEPA (Precios Claros)

# Arma, desde la base SEPA, el catálogo por código de barras y los precios de referencia de las
# sucursales de .github/catalogo-zonas.txt, y lo publica en la rama "catalogo".
# AVISO (nov-2026): el portal datos.produccion.gob.ar responde 403 a los servidores de GitHub, así que
# esto se hace desde tu computadora con local/gondola_catalogo.py (ver local/LEEME.txt). Este flujo queda
# solo para lanzarlo a mano, por si el portal vuelve a permitirlo: Actions > Catálogo SEPA > Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogo-sepa
  cancel-in-progress: true

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar catálogo
        env:
          ZONAS: .github/catalogo-zonas.txt
        run: python .github/scripts/catalogo_sepa.py out
      - name: Publicar en la rama catalogo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q
          git checkout -q -b catalogo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Catálogo SEPA $(date -u +%F)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" catalogo
          echo "## ✅ Catálogo publicado" >> "$GITHUB_STEP_SUMMARY"
          cat meta.json >> "$GITHUB_STEP_SUMMARY"
