<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-version" content="v0.10.2">
<title>Góndola Comparador</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#132033">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Góndola">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#132033; --muted:#5A6678; --line:#D5DBE2; --item:#F6F8FA;
  --accent:#1F55E0; --accent-ink:#FFFFFF; --tag:#FFD338; --tag-ink:#231B00;
  --good:#0F7A46; --warn:#9A6200; --bad:#BF3227; --good-bg:#E2F3E9; --warn-bg:#FFF0D2; --bad-bg:#FBE3E0; --sim:#6D28D9; --sim-bg:#F0E9FF;
  --font-d:"Barlow Condensed","Arial Narrow",sans-serif; --font-b:"Barlow",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  /* layout: app de una columna para celular; contexto de la visita fijo arriba, pestañas abajo, carteles amarillos de precio */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D131B; --surface:#16202B; --ink:#ECF1F7; --muted:#9AA7B8; --line:#2A3746; --item:#1C2835;
  --accent:#7EA4FF; --accent-ink:#0B1530; --good:#45CC88; --warn:#F2B64E; --bad:#FF7B6C;
  --good-bg:#13301F; --warn-bg:#33270F; --bad-bg:#3B1B17; --sim:#C4B1FF; --sim-bg:#2A2140; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D131B; --surface:#16202B; --ink:#ECF1F7; --muted:#9AA7B8; --line:#2A3746; --item:#1C2835;
  --accent:#7EA4FF; --accent-ink:#0B1530; --good:#45CC88; --warn:#F2B64E; --bad:#FF7B6C;
  --good-bg:#13301F; --warn-bg:#33270F; --bad-bg:#3B1B17; --sim:#C4B1FF; --sim-bg:#2A2140; color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 12px;display:grid;gap:8px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:440px){.brand .sub{display:none}}
.brand h1{font-family:var(--font-d);font-weight:700;font-size:26px;margin:0;letter-spacing:.2px}
.brand .dot{width:12px;height:12px;border-radius:3px;background:var(--tag);display:inline-block;transform:translateY(-2px)}
.ver{font-size:12px;color:var(--muted);margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.ver .vs-ver{margin:0;white-space:nowrap}
#syncBtn{min-width:40px;text-align:center}
.symsg{font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center;color:var(--accent);margin-top:-2px}
.symsg[hidden]{display:none}
.symsg.ok{color:var(--good)} .symsg.err{color:var(--bad)}
.visit{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.visit label{font-size:12px;color:var(--muted);display:grid;gap:3px;font-weight:600}
.vhint{grid-column:1/-1;font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
select,input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:9px 10px;min-height:44px;width:100%}
input:disabled,select:disabled{opacity:.6}
textarea{min-height:90px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
main{flex:1;padding:14px 16px calc(96px + env(safe-area-inset-bottom));display:grid;gap:14px;align-content:start}
.view{display:grid;gap:14px}
.view[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
h2{font-family:var(--font-d);font-size:22px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.fl{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.fl > input,.fl > select{font-weight:500;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}
.row .grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.w-num{width:110px;flex:none} .w-pack{width:64px;flex:none} .w-unit{width:84px;flex:none}
.price-in{font-family:var(--font-d);font-size:30px;font-weight:700;min-height:58px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 12px;min-height:38px;
  font:600 14px var(--font-b);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn{border:0;border-radius:12px;padding:12px 16px;min-height:48px;font:700 16px var(--font-b);cursor:pointer;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.switch{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
.switch input{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.p-good{background:var(--good-bg);color:var(--good)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)}
.p-neutral{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tag{background:var(--tag);color:var(--tag-ink);border-radius:4px;padding:1px 6px;font-size:12px;font-weight:700;white-space:nowrap}
.preview{background:var(--bg);border-radius:12px;padding:12px;display:grid;gap:8px;font-size:14px}
.pv-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.big{font-family:var(--font-d);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:15px;color:var(--muted);font-weight:600;margin-left:2px}
/* Precio por unidad de comparación: grande y en el azul de la app; el precio final de la presentación, oscuro y firme */
.big.per{color:var(--accent)}
.big.per small{color:inherit;opacity:.7}
.cu{color:var(--muted);font-weight:500}
.final{font-size:14px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.verdict{border-radius:14px;padding:14px;display:grid;gap:4px;border:2px solid}
.verdict.good{background:var(--good-bg);border-color:var(--good);color:var(--ink)}
.verdict.warn{background:var(--warn-bg);border-color:var(--warn)}
.verdict.none{background:var(--surface);border-color:var(--line)}
.verdict b.head{font-family:var(--font-d);font-size:21px}
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:10px 12px;
  display:grid;grid-template-columns:1fr auto;gap:6px 10px}
.item.s-good{border-left-color:var(--good)} .item.s-warn{border-left-color:var(--warn)} .item.s-bad{border-left-color:var(--bad)}
.item.here{box-shadow:inset 0 0 0 1px var(--accent)}
.it-title{font-weight:700}
.it-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px}
.it-sub{grid-column:1/-1;font-size:13px;color:var(--muted)}
.it-price{text-align:right;display:grid;gap:3px;justify-items:end;align-content:start}
.it-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}
.store{font-size:12px;font-weight:700;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:600}
.tile .val{font-family:var(--font-d);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.tile.main{background:var(--ink);color:var(--surface);border-color:var(--ink)} .tile.main .lbl{color:inherit;opacity:.8}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:var(--accent)}
.bar.full > i{background:var(--bad)}
table.calc{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.calc td{padding:6px 0;border-bottom:1px solid var(--line)} table.calc td:last-child{text-align:right;font-weight:600}
table.calc tr.total td{font-weight:800;font-size:16px;border-bottom:0}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 18px var(--font-b);cursor:pointer}
.stepper span{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.sec > summary{padding:14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.sec > summary::after{content:"+";color:var(--muted);font-weight:700}
details.sec[open] > summary::after{content:"–"}
details.sec > .body{padding:0 14px 14px;display:grid;gap:10px}
.drow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.drow:last-child{border-bottom:0}
/* Filas de listas: texto a la izquierda, botones juntos a la derecha (si no entran, bajan a otra línea alineados a la derecha) */
.drow{flex-wrap:wrap}
.drow>span:first-child{flex:1 1 160px;min-width:0}
.drow>.btns{flex:0 0 auto;flex-wrap:nowrap;margin-left:auto}
.drow .age-line{display:block;margin-top:4px}
.cpysel{width:22px;height:22px;min-height:0;padding:0;margin:0 8px 0 0;vertical-align:middle;accent-color:var(--accent)}
.cpypill{border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:700}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.paybox{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px}
.refbox{border:2px dashed var(--accent);color:var(--ink)}
.refsec summary{cursor:pointer;padding:2px 0}
.refrow{border-top:1px solid var(--line);padding:8px 0;display:grid;gap:4px}
.refley{font-weight:700;color:var(--tag-ink);background:var(--tag);border-radius:4px;padding:0 5px}
.calc-ex{width:100%;border-collapse:collapse;font-size:13px}
.calc-ex th,.calc-ex td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line)}
.calc-ex td:last-child,.calc-ex th:last-child{text-align:right}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:520px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:grid;justify-items:center;gap:2px;padding:9px 4px 10px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:700;position:relative}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs a[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{position:absolute;top:4px;left:56%;background:var(--tag);color:var(--tag-ink);border-radius:99px;font-size:11px;padding:0 6px;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(480px,92vw);
  background:var(--ink);color:var(--surface);padding:12px 14px;border-radius:12px;font-size:14px;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.scan{position:fixed;inset:0;background:#000;z-index:30;display:grid;place-items:center}
.scan[hidden]{display:none}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan .guide{position:absolute;left:8%;right:8%;top:40%;height:20%;border:3px solid var(--tag);border-radius:12px;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
.scan .scan-tip{position:absolute;top:calc(28% - 10px);left:0;right:0;text-align:center;color:#fff;font-weight:700;margin:0;padding:0 16px}
.scan button{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%)}
.result{border:2px solid var(--good);background:var(--good-bg)}
.sortbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.syncbar{position:absolute;left:0;right:0;bottom:-1px;height:3px;overflow:hidden;background:transparent}
.syncbar[hidden]{display:none}
.syncbar i{position:absolute;top:0;bottom:0;width:35%;background:var(--accent);border-radius:3px;animation:sybar 1.1s ease-in-out infinite}
@keyframes sybar{0%{left:-35%}100%{left:100%}}
.sy-ic{display:inline-block}
.sy-ic.spin{animation:syspin 1s linear infinite}
@keyframes syspin{to{transform:rotate(360deg)}}
.vs-ver.sy-busy{color:var(--accent);border-color:var(--accent);opacity:.9}
.vs-ver.sy-ok{color:var(--good);border-color:var(--good);background:var(--good-bg)}
.vs-ver.sy-err{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
@media (prefers-reduced-motion:reduce){.sy-ic.spin{animation:none}.syncbar i{animation:none;left:0;width:100%;opacity:.6}}
.needbox{display:grid;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.needbox select{min-height:40px}
.needbox .stepper span,.lline .stepper span{min-width:44px}
.lline{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.item.sim{border-style:dashed;border-left-style:solid;border-left-color:var(--sim);background:var(--sim-bg)}
.p-sim{background:var(--sim);color:var(--surface)}
.pct{font-size:.85em;font-weight:500;color:var(--muted)}
.p-day{background:var(--accent);color:var(--accent-ink)}
.pill.age{background:transparent;border:1px solid currentColor;font-weight:600}
.verdict.simv{background:var(--sim-bg);border-color:var(--sim);border-style:dashed}
.simreal{border-left:3px solid var(--sim);padding-left:8px}
.sim-btn{color:var(--sim);border-color:var(--sim)}
.simbox{grid-column:1/-1;display:grid;gap:8px;border:2px dashed var(--sim);border-radius:12px;padding:10px;background:var(--surface)}
.simbanner{border:2px dashed var(--sim);background:var(--sim-bg);border-radius:12px;padding:10px;font-size:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prodpick-wrap{display:grid;gap:8px}
.prodpick{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit;cursor:pointer;min-height:52px}
.prodpick b{font-size:17px}
.ppov{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.ppov[hidden]{display:none}
.pp-head{display:flex;gap:8px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.pp-body{flex:1;overflow:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom));max-width:520px;width:100%;margin:0 auto;box-sizing:border-box}
.pp-sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden}
.pp-title{padding:10px 12px;font-weight:700;cursor:pointer;list-style:none}
.pp-item{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:12px;cursor:pointer;min-height:48px}
.pp-item.on{background:var(--bg);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.pvl{display:grid;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.storebar{display:grid;gap:6px;padding:10px;border-radius:12px;background:var(--bg)}
.storebar.other{background:var(--warn-bg);box-shadow:inset 0 0 0 2px var(--warn)}
.storebar select{font-weight:700}
.pstores{border:1px solid var(--line);border-radius:12px;padding:8px 10px}
details.more summary{cursor:pointer;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile-d{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:grid;overflow:hidden;align-content:start}
.tile-d.wide{grid-column:1/-1}
.tile-main{border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.tile-main:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.tile-main .ti{width:38px;height:38px;border-radius:10px;background:var(--bg);display:grid;place-items:center;color:var(--accent)}
.tile-main .ti svg{width:22px;height:22px}
.tile-main .tt{font-weight:700;font-size:16px}
.tile-main .tc{grid-column:1/-1;font-family:var(--font-d);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.tile-main .tl{grid-column:1/-1;font-size:13px;color:var(--muted)}
.tile-alert{border:0;border-top:1px solid var(--line);background:var(--warn-bg);color:var(--warn);font:700 13px var(--font-b);padding:9px 14px;text-align:left;cursor:pointer}
.dnav{display:grid;gap:8px}
.dnav > .btn{justify-self:start}
.dtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.dtabs::-webkit-scrollbar{display:none}
.dtabs .chip{white-space:nowrap;flex:none}
.dtabs .chip[aria-pressed="true"] .muted{color:inherit;opacity:.75}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dhead h2{display:flex;gap:8px;align-items:center}
.dhead h2 svg{width:22px;height:22px;color:var(--accent);flex:none}
.dbody{gap:10px}
/* Datos: barra de sección fija (debajo de la cabecera), ítems como tarjetas y títulos de grupo fijos */
.dstick{position:sticky;top:var(--hdr,0px);z-index:4;background:var(--bg);margin:-14px -16px 0;padding:10px 16px 8px;display:grid;gap:8px;border-bottom:2px solid var(--accent);grid-template-columns:minmax(0,1fr)}
main,.view{grid-template-columns:minmax(0,1fr)}
.dstick .dnav{display:flex;gap:8px;align-items:center}
.dstick .dnav .dtabs{flex:1;min-width:0}
.dstick .dnav>.btn{flex:none}
.dstick .dhead h2{margin:0;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dstick .dhead .btn{flex:none}
.dstick .dhead .cnt{font-family:var(--font-b);font-size:14px;font-weight:600;color:var(--muted)}
.dbody .drow{background:var(--item);border:1px solid var(--line);border-radius:10px;padding:10px}
.dbody .drow:last-child{border-bottom:1px solid var(--line)}
.dbody .drow+.drow{margin-top:8px}
.dbody .paybox,.dbody .refrow{background:var(--item);border:1px solid var(--line);border-radius:10px;padding:10px}
.dbody .refrow+.refrow{margin-top:8px}
#edform{border:2px solid var(--accent);background:var(--surface)}

<script>
"use strict";
/* ============ utilidades ============ */
const LS = 'gondola.v1';
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const isoOf = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
const todayISO = () => isoOf(new Date());
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return isoOf(d); };
const ageDays = iso => Math.max(0, Math.round((new Date(todayISO()) - new Date(iso)) / 864e5));
const DOW = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const nf0 = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nfx = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 2 });
const money = v => '$ ' + (Math.abs(v) >= 100 ? nf0.format(v) : nf2.format(v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function num(s) {
  if (typeof s === 'number') return s;
  s = String(s ?? '').trim().replace(/\s|\$/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return parseFloat(s);
}
let toastT;
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms); }

/* ============ unidades ============ */
const BASES = {
  kg: { short: 'kg', units: { g: 0.001, kg: 1 }, def: 'g', chips: [[250, 'g'], [500, 'g'], [1, 'kg'], [2, 'kg']] },
  L:  { short: 'L', units: { ml: 0.001, cc: 0.001, L: 1 }, def: 'ml', chips: [[500, 'ml'], [900, 'ml'], [1, 'L'], [1.5, 'L'], [2.25, 'L']] },
  un: { short: 'un', units: { un: 1 }, def: 'un', chips: [[1, 'un'], [6, 'un'], [12, 'un'], [30, 'un']] },
  m:  { short: 'm', units: { m: 1 }, def: 'm', chips: [[30, 'm'], [50, 'm'], [80, 'm']] }
};
/* Categorías iniciales de productos (se pueden editar en Datos → Productos) */
const DEFAULT_CATS = ['Almacén', 'Bebidas', 'Lácteos y frescos', 'Carnes', 'Frutas y verduras', 'Panadería', 'Congelados', 'Limpieza', 'Perfumería e higiene', 'Bebés', 'Mascotas', 'Otros'];
const baseOf = prod => BASES[prod?.base] || { short: prod?.base || 'u', units: { [prod?.base || 'u']: 1 }, def: prod?.base || 'u', chips: [] };
const getProd = id => S.prods.find(x => x.id === id);
const getPres = id => S.pres.find(x => x.id === id);
const getPrice = id => S.prices.find(x => x.id === id);
const getStore = id => S.stores.find(x => x.id === id);
const getPay = id => S.pays.find(x => x.id === id) || NOPAY;
const activeStores = () => S.stores.filter(s => !s.archived);
/* El precio que se descarta pasa al historial del que queda, si es más viejo */
function mergeHist(keep, lose) {
  if ((lose.fecha || '') <= (keep.fecha || '')) keep.hist = [...(keep.hist || []), ...(lose.hist || []), { precio: lose.precio, fecha: lose.fecha }].sort((a, b) => (a.fecha < b.fecha ? -1 : 1)).slice(-12);
}
const contentOf = pres => { const b = baseOf(getProd(pres.prodId)); return pres.cont * (b.units[pres.unit] ?? 1) * (pres.pack || 1); };
const presLabel = pres => `${pres.marca || 'Sin marca'}${pres.desc ? ' ' + pres.desc : ''} · ${pres.cont > 0 ? `${pres.pack > 1 ? pres.pack + ' × ' : ''}${nfx.format(pres.cont)} ${pres.unit}` : 'contenido pendiente'}`;

/* ============ motor de promociones ============
   Toda promo se expresa como: "llevando N unidades, el total es T".  */
/* Días de la semana próxima: k = 0 es hoy */
const DOW_L = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const dayInfo = k => { const d = new Date(); d.setDate(d.getDate() + k); return { k, dow: d.getDay(), date: isoOf(d) }; };
const ddmm = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '';
const buyTxt = a => 'Comprar ' + (a.k === 0 ? 'hoy' : a.k === 1 ? 'mañana' : `${DOW[a.dow].toLowerCase()} ${ddmm(a.date)}`);
const agePill = iso => `<span class="pill age ${ageCls(iso)}" title="Antigüedad del precio cargado">precio de ${ageTxt(iso)}</span>`;
const dayTxt = a => (a.k === 0 ? 'hoy' : a.k === 1 ? 'mañana' : `el ${DOW_L[a.dow]} ${ddmm(a.date)}`);
function promo(p, date = todayISO()) {
  const P = p.precio, r = p.promo || { t: 'none' };
  // Promo con vigencia: después de la fecha "hasta" ya no aplica
  if (r.t !== 'none' && p.hasta && date > p.hasta) return { N: 1, total: P, label: '', on: false, expired: true };
  switch (r.t) {
    case 'fixed': return { N: 1, total: r.v, label: 'Oferta ' + money(r.v), on: true };
    case 'pct':   return { N: 1, total: P * (1 - r.v / 100), label: r.v + '% off', on: true };
    case 'nth':  { const n = r.n || 2; return { N: n, total: P * (n - 1) + P * (1 - r.v / 100), label: `${n}ª al ${r.v}%`, on: true }; }
    case 'nxm':   return { N: r.n, total: P * r.m, label: `${r.n}x${r.m}`, on: true };
    case 'nfor':  return { N: r.n, total: r.v, label: `${r.n} por ${money(r.v)}`, on: true };
    default:      return { N: 1, total: P, label: '', on: false };
  }
}
const NOPAY = { id: 'none', name: 'Sin descuento', pct: 0 };
function payRate(pay, storeId, dow = new Date().getDay()) {
  if (!pay || pay.id === 'none') return 0;
  if (pay.stores?.length && !pay.stores.includes(storeId)) return 0;
  if (pay.dias?.length && !pay.dias.includes(dow)) return 0;
  return (pay.pct || 0) / 100;
}
/* Precio efectivo por unidad base, para "llevando 1" y "llevando N" */
function calc(p, pay, pres = getPres(p.presId), at = null) {
  const C = contentOf(pres), d = payRate(pay, p.storeId, at ? at.dow : undefined), pr = promo(p, at ? at.date : undefined);
  let one;
  const ac = !!p.acum || pay?.base === 'total';
  if (pr.on && pr.N === 1) one = { total: pr.total * (ac ? 1 - d : 1), payOn: ac && d > 0, promoOn: true };
  else one = { total: p.precio * (1 - d), payOn: d > 0, promoOn: false };
  one.per = one.total / C;
  let many = null;
  if (pr.N > 1) { many = { total: pr.total * (ac ? 1 - d : 1), payOn: ac && d > 0, promoOn: true }; many.per = many.total / (pr.N * C); }
  const best = many && many.per < one.per - 1e-9 ? { ...many, N: pr.N } : { ...one, N: 1 };
  return { one, many, best, pr, d, C, lista: p.precio / C, pay, at: at || dayInfo(0) };
}
/* El mejor precio de los próximos 7 días, probando cada medio de pago (a igual precio gana el día más cercano) */
function bestWeek(p, pres = getPres(p.presId)) {
  let bc = null;
  for (let k = 0; k < 7; k++) { const at = dayInfo(k); for (const pay of [NOPAY, ...S.pays]) { const c = calc(p, pay, pres, at); if (!bc || c.best.per < bc.best.per - 0.005) bc = c; } }
  return bc;
}
const promoTxt = p => { const pr = promo(p); return pr.expired ? `promo vencida (${esc(p.promo.t === 'none' ? '' : promo(p, p.hasta).label)})` : esc(pr.label) + (p.hasta ? ' hasta ' + ddmm(p.hasta) : ''); };
const conPay = c => (c.d > 0 && (c.best.payOn || !c.best.promoOn) ? `con ${c.pay.name} ${c.pay.pct}%` : 'sin descuento de pago');
const payName = c => (c.d > 0 && (c.best.payOn || !c.best.promoOn) ? `${c.pay.name} ${c.pay.pct}%` : 'sin descuento de pago');
/* Diferencias en pesos sobre la MISMA cantidad: la que comprarías con la opción de referencia (N × contenido) */
const qtyOf = c => (c.best.N || 1) * c.C;
const qtyTxt = (c, u) => `${nfx.format(qtyOf(c))} ${u}`;
const pctS = f => `<span class="pct">(${f >= 0 ? '−' : '+'}${nf0.format(Math.abs(f) * 100)}%)</span>`;
function weekHint(cNow, w, u) {
  if (!w || w.at.k === 0 || !(w.best.per < cNow.best.per * 0.995)) return '';
  const pct = (1 - w.best.per / cNow.best.per) * 100;
  const ah = (cNow.best.per - w.best.per) * qtyOf(w);
  return `Mejor ${dayTxt(w.at)} ${esc(conPay(w))}: ${money(w.best.per)}/${u}${w.best.N > 1 ? ` llevando ${w.best.N}` : ''} · ahorrás ${money(ah)} en ${qtyTxt(w, u)} ${pctS(pct / 100)}`;
}
function bestPay(p) {
  let bc = calc(p, NOPAY);
  for (const pay of S.pays) { const c = calc(p, pay); if (c.best.per < bc.best.per - 1e-9) bc = c; }
  return bc;
}
function rowsFor(prodId, mode, withSim) {
  const vpay = getPay(S.visit.payId);
  return S.prices.filter(p => getPres(p.presId)?.prodId === prodId && getStore(p.storeId) && !getStore(p.storeId).archived)
    .map(p => ({ p, pres: getPres(p.presId), c: mode === 'week' ? bestWeek(p) : mode === 'best' ? bestPay(p) : calc(p, vpay) }))
    .map(r => (withSim && SIM.size ? simRow(r, mode) : r))
    .sort((a, b) => a.c.best.per - b.c.best.per);
}

/* ============ datos de ejemplo ============ */
function seed() {
  const dow = new Date().getDay();
  const s1 = 's1', s2 = 's2';
  const D = {
    ver: 1, demo: true,
    stores: [{ id: s1, name: 'Súper Norte · Palermo' }, { id: s2, name: 'Híper Sur · Avellaneda' }],
    pays: [
      { id: 'p1', name: 'Banco Azul crédito', pct: 20, tope: 15000, usado: 13500, minimo: 10000, dias: [dow, (dow + 1) % 7], stores: [s1], modo: 'caja' },
      { id: 'p2', name: 'Billetera Celeste', pct: 10, tope: null, usado: 0, minimo: 15000, dias: [], stores: [], modo: 'reintegro' },
      { id: 'p3', name: 'Banco Rojo débito', pct: 25, tope: 10000, usado: 0, minimo: null, dias: [(dow + 2) % 7], stores: [s2], modo: 'reintegro' }
    ],
    prods: [
      { id: 'ac', name: 'Aceite de girasol', base: 'L', cat: 'Almacén' }, { id: 'ye', name: 'Yerba mate', base: 'kg', cat: 'Almacén' },
      { id: 'ph', name: 'Papel higiénico', base: 'm', cat: 'Perfumería e higiene' }, { id: 'le', name: 'Leche entera', base: 'L', cat: 'Lácteos y frescos' }
    ],
    pres: [], prices: [], visit: { storeId: s1, payId: 'p1' }, cart: []
  };
  const P = (id, prodId, marca, desc, cont, unit, pack, ean) => D.pres.push({ id, prodId, marca, desc, cont, unit, pack, ean });
  const R = (presId, storeId, precio, promo, ago, acum = false) => { const id = 'r' + D.prices.length; D.prices.push({ id, presId, storeId, precio, promo: promo || { t: 'none' }, acum, fecha: daysAgo(ago), hist: [] }); return id; };
  P('a1', 'ac', 'Girasol Dorado', '', 1.5, 'L', 1, '7791234000024');
  P('a2', 'ac', 'Girasol Dorado', '', 900, 'ml', 1, '7791234000017');
  P('a3', 'ac', 'Cocinera Fina', '', 1.5, 'L', 1, '7791234000031');
  P('a4', 'ac', 'Marca propia', '', 1.5, 'L', 1, '');
  P('y1', 'ye', 'Monte Verde', 'con palo', 1, 'kg', 1, '7791234000048');
  P('y2', 'ye', 'Monte Verde', 'con palo', 500, 'g', 1, '7791234000055');
  P('y3', 'ye', 'Río Alto', 'suave', 1, 'kg', 1, '7791234000062');
  P('h1', 'ph', 'Suave+', 'hoja simple', 30, 'm', 4, '7791234000079');
  P('h2', 'ph', 'Nube', 'doble hoja', 80, 'm', 4, '7791234000086');
  P('l1', 'le', 'La Pradera', 'sachet', 1, 'L', 1, '7791234000093');
  P('l2', 'le', 'Marca propia', 'sachet', 1, 'L', 1, '');
  R('a1', s1, 3000, null, 0); R('a1', s2, 2850, null, 12);
  const ra2 = R('a2', s1, 1950, { t: 'nth', n: 2, v: 70 }, 0); R('a2', s2, 1890, null, 12);
  R('a3', s1, 3200, { t: 'pct', v: 15 }, 1); R('a3', s2, 3100, null, 26);
  R('a4', s1, 2750, null, 0);
  R('y1', s1, 4200, null, 0); R('y1', s2, 3890, { t: 'nth', n: 2, v: 50 }, 3);
  const ry2 = R('y2', s1, 2300, { t: 'nxm', n: 3, m: 2 }, 0); D.prices.find(x => x.id === ry2).hasta = daysAgo(-1); R('y2', s2, 2250, null, 3);
  R('y3', s1, 4050, { t: 'fixed', v: 3600 }, 1); R('y3', s2, 4100, null, 3);
  R('h1', s1, 2400, null, 2); R('h1', s2, 2300, { t: 'nth', n: 2, v: 50 }, 5);
  R('h2', s1, 5200, { t: 'pct', v: 20 }, 2); R('h2', s2, 5500, null, 5);
  R('l1', s1, 1450, { t: 'nfor', n: 2, v: 2500 }, 0); R('l1', s2, 1390, null, 30);
  const rl2 = R('l2', s1, 1150, null, 0); R('l2', s2, 1120, null, 30);
  D.prices.find(x => x.id === ra2).hist = [{ precio: 1790, fecha: daysAgo(33) }];
  D.cart = [{ priceId: ra2, qty: 2 }, { priceId: ry2, qty: 2 }, { priceId: rl2, qty: 4 }];
  return D;
}
let S;
function load() {
  try { const raw = localStorage.getItem(LS); if (raw) { const d = JSON.parse(raw); if (d && d.stores && d.prices) return d; } } catch (e) {}
  return seed();
}
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
/* Preparado para sincronizar: cada registro lleva "upd" (última modificación)
   y los borrados quedan como marcas en S.tomb {c: colección, id, upd}. */
const COLLS = ['stores', 'pays', 'prods', 'pres', 'prices', 'compras', 'assoc', 'docs'];
const nowISO = () => new Date().toISOString();
const touch = r => { if (r) r.upd = nowISO(); return r; };
const tomb = (c, id) => { S.tomb.push({ c, id, upd: nowISO() }); };
function migrate(d) {
  const t = nowISO();
  // Asociaciones de tickets: de objeto a registros sincronizables
  if (d.tkmap && !(d.assoc && d.assoc.length)) { d.assoc = Object.entries(d.tkmap).map(([id, v]) => ({ id, v, upd: t })); }
  delete d.tkmap;
  COLLS.forEach(c => (d[c] = d[c] || []).forEach(r => { r.upd = r.upd || t; }));
  d.pays.forEach(p => { if (p.minimo === undefined) p.minimo = null; });
  d.tomb = d.tomb || []; d.need = d.need || []; d.remind = d.remind || [];
  if (!Array.isArray(d.cats)) d.cats = DEFAULT_CATS.slice();
  d.prods.forEach(p => { if (p.cat && !d.cats.includes(p.cat)) d.cats.push(p.cat); });
  // Listas: de cantidad en kg/L a unidades de una presentación
  d.need.forEach(n => {
    if (n.units != null && n.presId) return;
    const ps = d.pres.filter(x => x.prodId === n.prodId); if (!ps.length) return;
    const cOf = x => { const pr = d.prods.find(q => q.id === x.prodId); const b = BASES[pr?.base] || { units: {} }; return x.cont * (b.units[x.unit] ?? 1) * (x.pack || 1); };
    const amt = n.amt || cOf(ps[0]); const fit = ps.filter(x => cOf(x) <= amt + 1e-9).sort((a, b) => cOf(b) - cOf(a))[0] || ps.sort((a, b) => cOf(a) - cOf(b))[0];
    n.presId = fit.id; n.units = Math.max(1, Math.round(amt / cOf(fit))); n.flex = false; n.pin = null; delete n.amt;
  });
  d.schema = 2; return d;
}
S = migrate(load());

/* ============ estado de UI ============ */
const defUnit = prod => baseOf(prod).def;
let F; // formulario de carga
/* Último producto usado en Cargar (se recuerda en el celular) */
const LASTPROD_LS = 'gondola.lastProd';
function lastProd() {
  let id = null; try { id = localStorage.getItem(LASTPROD_LS); } catch (e) {}
  if (id && S.prods.some(p => p.id === id)) return id;
  const r = [...S.prods].sort((a, b) => (lastUseProdSafe(b) > lastUseProdSafe(a) ? 1 : -1))[0];

function cartCalc() {
  const sid = S.visit.storeId, pay = getPay(S.visit.payId), d = payRate(pay, sid);
  let lista = 0, promoSave = 0, base = 0; const items = [];
  for (const it of S.cart) {
    if (it.plan) continue;
    const p = getPrice(it.priceId); if (!p || p.storeId !== sid || !getPres(p.presId)) continue;
    const pr = promo(p), q = it.qty;
    const groups = pr.on ? Math.floor(q / pr.N) : 0, rem = q - groups * pr.N;
    const promoPart = groups * pr.total, remPart = rem * p.precio, sub = promoPart + remPart;
    lista += q * p.precio; promoSave += q * p.precio - sub; base += remPart + (p.acum || pay.base === 'total' ? promoPart : 0);
    let hint = '';
    if (pr.on && pr.N > 1 && rem > 0) {
      const add = pr.N - rem, extra = pr.total - rem * p.precio;
      hint = extra <= 0.5 ? `Sumando ${add} más pagás lo mismo` : `Sumando ${add} más completás la promo: +${money(extra)}`;
    }
    items.push({ it, p, pr, groups, rem, sub, hint });
  }
  const raw = base * d;
  const rest = pay.id !== 'none' && pay.tope ? Math.max(0, pay.tope - (pay.usado || 0)) : Infinity;
  const neto = lista - promoSave;
  // Monto mínimo: se mide sobre el total del ticket después de las promos de la tienda
  const minimo = d > 0 && pay.minimo ? pay.minimo : 0;
  const faltaMin = minimo && neto < minimo ? minimo - neto : 0;
  const desc = faltaMin ? 0 : Math.min(raw, rest);
  return { items, lista, promoSave, base, d, raw, desc, rest, capped: !faltaMin && raw > rest + 0.5, pay, neto, minimo, faltaMin, caja: neto - (pay.modo === 'reintegro' ? 0 : desc), final: neto - desc };
}

function edSave() {
  const d = ED.d;
  if (ED.kind === 'prod') {
    const p = getProd(ED.id), name = (d.name || '').trim(); if (!name) return toast('El nombre no puede quedar vacío');
    const base = d.base === 'otro' ? (d.custom || '').trim() : d.base; if (!base) return toast('Indicá la unidad de comparación');
    if (base !== p.base) {
      const info = baseChangeInfo(p, base);
      if (info.priced.length) return toast('No se puede cambiar la unidad: hay presentaciones con precios cargados');
      // Las presentaciones toman la unidad nueva; si tenían contenido en otra familia, quedan pendientes
      const units = (BASES[base] || { units: { [base]: 1 } }).units, du = BASES[base] ? BASES[base].def : base;
      info.ps.forEach(x => { if (units[x.unit] === undefined) { if (x.cont > 0) { x.cont = 0; x.pend = true; } x.unit = du; touch(x); } });
      S.need = S.need.filter(nd => !info.reset.some(x => x.id === nd.presId));
      if (info.reset.length) toast(`${info.reset.length} presentación${info.reset.length === 1 ? '' : 'es'} quedó pendiente de cargar el contenido (Datos → Pendientes).`, 4500);
    }
    const cat = (d.cat || '').trim(); if (cat && !S.cats.includes(cat)) S.cats.push(cat);
    p.name = name; p.base = base; p.cat = cat; touch(p);
  } else if (ED.kind === 'pres') {
    const x = getPres(ED.id), cont = num(d.cont), pack = Math.round(num(d.pack));
    if (!(cont > 0)) return toast('El contenido tiene que ser mayor a 0');
    if (!(pack >= 1)) return toast('El pack tiene que ser 1 o más');

/* ============ Datos de internet por código de barras (Open Food Facts y bases hermanas) ============
   Completa marca, variedad, contenido y unidad; siempre se revisa antes de guardar. */
const LOOK = new Map();   // código -> resultado (cache en memoria)
const LOOK_SRC = [['Open Food Facts', 'https://world.openfoodfacts.org'], ['Open Beauty Facts', 'https://world.openbeautyfacts.org'], ['Open Products Facts', 'https://world.openproductsfacts.org']];
function eanOk(code) {
  if (!/^\d{8}$|^\d{12,13}$/.test(code)) return false;
  const d = code.split('').map(Number), chk = d.pop(); let s2 = 0;
  d.reverse().forEach((n, i) => { s2 += n * (i % 2 === 0 ? 3 : 1); });
  return (10 - (s2 % 10)) % 10 === chk;
}
/* "473 ml", "1,5 L", "6 x 473 ml", "750cc", "500 g", "4 x 30 m" → { cont, unit, pack, fam } */
function parseQty(txt, num2, unit2) {
  const U = { ml: ['ml', 1, 'L'], cl: ['ml', 10, 'L'], l: ['L', 1, 'L'], lt: ['L', 1, 'L'], lts: ['L', 1, 'L'], litro: ['L', 1, 'L'], litros: ['L', 1, 'L'], cc: ['cc', 1, 'L'], g: ['g', 1, 'kg'], gr: ['g', 1, 'kg'], grs: ['g', 1, 'kg'], gramos: ['g', 1, 'kg'], kg: ['kg', 1, 'kg'], kilo: ['kg', 1, 'kg'], kilos: ['kg', 1, 'kg'], m: ['m', 1, 'm'], mt: ['m', 1, 'm'], mts: ['m', 1, 'm'], metros: ['m', 1, 'm'], u: ['un', 1, 'un'], un: ['un', 1, 'un'], unid: ['un', 1, 'un'], unidades: ['un', 1, 'un'] };
  const m = String(txt || '').toLowerCase().match(/(?:(\d+)\s*[x×]\s*)?(\d+(?:[.,]\d+)?)\s*(ml|cl|lts|lt|litros|litro|l|cc|grs|gramos|gr|g|kg|kilos|kilo|mts|mt|metros|m|unidades|unid|un|u)\b/);
  if (m && U[m[3]]) { const [unit, f, fam] = U[m[3]]; return { pack: m[1] ? +m[1] : 1, cont: num(m[2]) * f, unit, fam }; }
  const u2 = String(unit2 || '').toLowerCase();
  if (num2 > 0 && U[u2]) { const [unit, f, fam] = U[u2]; return { pack: 1, cont: num2 * f, unit, fam }; }
  return null;
}
/* Catálogo SEPA (Precios Claros) armado por el flujo semanal y publicado en la rama "catalogo" */
const SEPA_BASE = 'https://raw.githubusercontent.com/luchorcompartidos/super/catalogo/ean/';
const SEPA_SHARD = new Map();
async function sepaFind(code) {
  const k = code.slice(0, 5);

    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 8000);
    try { const r = await fetch(SEPA_BASE + k + '.json', { signal: ctl.signal }); SEPA_SHARD.set(k, r.ok ? await r.json() : {}); }
    finally { clearTimeout(tm); }
  }
  const v = SEPA_SHARD.get(k)[code]; if (!v) return null;
  const [desc, marca, cant, uni] = v;
  // La descripción de SEPA suele terminar con la cantidad ("… 473 Ml"): se quita porque va en Contenido
  const name = desc.replace(/\s+\d+(?:[.,]\d+)?\s*(?:ml|cc|cl|lts?|l|grs?|g|kgs?|un|unid|mts?|m)\.?\s*$/i, '').trim();
  return { src: 'Precios Claros (SEPA)', url: 'https://www.preciosclaros.gob.ar', brand: titleCase(marca), name, qty: parseQty('', cant, uni), cats: '', catEs: '' };
}
const titleCase = t => String(t || '').toLowerCase().replace(/(^|[\s-])\p{L}/gu, m => m.toUpperCase());

/* ============ Precios Claros: precios de referencia por sucursal (SEPA) ============
   El flujo semanal publica en la rama "catalogo" todas las sucursales de las zonas configuradas y sus precios.
   Acá vinculás hasta 10 tiendas tuyas con su sucursal: se descargan solo esas, y la elección queda en tu celular
   y en tu planilla, no en el repo. Son precios de referencia: nunca reemplazan los tuyos sin que lo confirmes. */
const SEPA_ROOT = 'https://raw.githubusercontent.com/luchorcompartidos/super/catalogo/';

const REF = new Map();   // clave de sucursal -> { st: 'loading' | 'ok' | 'none' | 'err', d }
let SUCS = null, SUCST = '', SQ = '', LINK = null, REFOPEN = false;
const linkedStores = () => S.stores.filter(s => s.sepa);
async function getJSON(url, fresh) {
  if (fresh) { try { const c = await caches.open('gondola-runtime-v1'); await c.delete(url); } catch (e) {} }
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 20000);
  try { const r = await fetch(url, { signal: ctl.signal }); if (r.status === 404) return null; if (!r.ok) throw new Error('http ' + r.status); return await r.json(); }
  finally { clearTimeout(tm); }
}
async function loadRefs(fresh = false) {
  const keys = [...new Set(linkedStores().map(s => s.sepa))];
  await Promise.all(keys.map(async k => {
    const prev = REF.get(k);
    if (!fresh && prev && (prev.st === 'ok' || prev.st === 'loading')) return;

async function lookupEan(code) {
  if (LOOK.has(code)) return LOOK.get(code);
  let lastErr = null;
  // 1) Catálogo argentino (Precios Claros); si no está o no responde, 2) Open Food Facts y bases hermanas
  try { const r0 = await sepaFind(code); if (r0) { LOOK.set(code, r0); return r0; } } catch (e) { lastErr = 'sin conexión con el catálogo'; }
  for (const [name, base] of LOOK_SRC) {
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 8000);
        const r = await fetch(`${base}/api/v2/product/${code}.json?fields=product_name,product_name_es,generic_name_es,generic_name,brands,quantity,product_quantity,product_quantity_unit,categories_tags`, { signal: ctl.signal });
        clearTimeout(tm);
        if (r.status === 503 || r.status === 429) { lastErr = 'el servicio está ocupado'; await new Promise(ok => setTimeout(ok, 1500)); continue; }
        if (r.status === 404) break;
        if (!r.ok) { lastErr = 'respuesta ' + r.status; break; }
        const j = await r.json();
        if (j.status !== 1 || !j.product) break;
        const pr = j.product, res = { src: name, url: `${base}/product/${code}`, brand: String(pr.brands || '').split(',')[0].trim(), name: (pr.product_name_es || pr.product_name || pr.generic_name_es || pr.generic_name || '').trim(), qty: parseQty(pr.quantity, pr.product_quantity, pr.product_quantity_unit), cats: (pr.categories_tags || []).join(' '), catEs: (pr.categories_tags || []).filter(t => t.startsWith('es:')).pop() || '' };
        LOOK.set(code, res); return res;
      } catch (e) { lastErr = e.name === 'AbortError' ? 'no respondió a tiempo' : 'sin conexión con el servicio'; break; }
    }
  }
  if (lastErr) throw new Error(lastErr);
  LOOK.set(code, null); return null;
}
/* Busca y completa los campos vacíos del formulario de Cargar */
async function lookupFill(manual) {

  if (!editable || !eanOk(code)) { if (manual) toast(eanOk(code) ? 'Esta presentación ya está completa.' : 'El código no parece válido (revisá los dígitos).'); return; }
  if (navigator.onLine === false) { if (manual) toast('Sin conexión: guardalo como pendiente y buscá los datos después.'); return; }
  F.look = { st: 'loading' }; renderCargar();
  try {
    const res = await lookupEan(code);
    if ((F.ean || '').trim() !== code) return; // cambió el código mientras buscaba
    if (!res) { F.look = { st: 'none' }; renderCargar(); return; }
    let brand = res.brand, desc = res.name;
    if (brand && desc.toLowerCase().startsWith(brand.toLowerCase())) desc = desc.slice(brand.length).trim();
    if (!F.marca) F.marca = brand; if (!F.desc) F.desc = desc;
    const notes = [];
    // Producto comparable: tiene que coincidir con el artículo (todas las palabras de su nombre y, si se conoce
    // la cantidad, la misma unidad). Se decide aunque el servicio no informe la cantidad.
    const fits = p => !res.qty || (BASES[p.base] ? p.base : null) === res.qty.fam;
    const txt = fold(`${res.name} ${res.brand} ${res.cats}`);
    if (F.presId === 'new') {
      const STOP = new Set(['de', 'del', 'la', 'las', 'el', 'los', 'con', 'sin', 'para', 'y', 'en', 'x']);
      const words = p => fold(p.name).split(/\s+/).filter(w => w.length > 1 && !STOP.has(w));
      const toks = txt.split(/[^a-z0-9ñ]+/);
      const matches = p => fits(p) && words(p).length > 0 && words(p).every(w => toks.some(t => t === w || t === w + 's' || t + 's' === w || (w.length > 4 && t.startsWith(w))));
      const prev = getProd(F.prodId);
      const cand = prev && matches(prev) ? prev : S.prods.filter(matches).sort((a, b) => words(b).length - words(a).length)[0];
      if (cand) { if (cand.id !== F.prodId) notes.push(`Se eligió el producto "${cand.name}"${prev ? ` (estaba "${prev.name}")` : ''}: revisalo.`); F.prodId = cand.id; }
      else {
        // Ningún producto coincide: "+ Nuevo producto…" con nombre por categoría y unidad por envase (si se conoce)
        const nm = res.catEs ? res.catEs.replace(/^es:/, '').replace(/-/g, ' ') : ((res.name.split(/\s+/).find(w => w.length > 2 && !/\d/.test(w)) || res.name).toLowerCase());
        NP = { name: nm.charAt(0).toUpperCase() + nm.slice(1), base: res.qty ? res.qty.fam : (prev?.base || 'un'), custom: '', cat: secCat(F.catHint) || suggestCat(`${res.name} ${res.cats}`) }; F.prodId = '__new';
        notes.push(`Ningún producto tuyo coincide con este artículo${prev ? ` (estaba "${prev.name}")` : ''}: revisá el nombre${res.qty ? '' : ' y la unidad de comparación'} sugeridos y tocá "Crear producto", o elegí otro en el desplegable.`);
      }
    }
    if (res.qty) {
      if (!(num(F.cont) > 0) && (!getProd(F.prodId) || fits(getProd(F.prodId)))) { F.cont = nfx.format(res.qty.cont); F.unit = res.qty.unit; F.pack = String(res.qty.pack); }
    } else notes.push('No trae el contenido: completalo a mano.');
    F.look = { st: 'ok', src: res.src, url: res.url, warn: notes.join(' ') };
    renderCargar();
  } catch (e) { F.look = { st: 'err', msg: e.message }; renderCargar(); }
}

/* Lector de códigos: usa el lector nativo (Android/Chrome) o, si no existe (iPhone), la librería ZXing.
   La librería se descarga una vez y queda guardada en el celular para usarla sin señal. */
const ZX_URLS = ['https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js', 'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js'];
let zxP = null;
function loadZXing() {
  if (window.ZXing) return Promise.resolve(window.ZXing);
  if (zxP) return zxP;
  zxP = (async () => {
    for (const u of ZX_URLS) {
      try {
        await new Promise((ok, ko) => { const s = document.createElement('script'); s.src = u; s.async = true; s.crossOrigin = 'anonymous'; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
        if (window.ZXing) return window.ZXing;
      } catch (e) {}
    }
    zxP = null; throw new Error('lector no disponible');
  })();
  return zxP;
}
async function makeDetector() {
  if ('BarcodeDetector' in window) {
    try {
      const d = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
      return { detect: async v => { const r = await d.detect(v); return r[0]?.rawValue || null; } };
    } catch (e) {}
  }
  const Z = await loadZXing();
  const hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]);
  hints.set(Z.DecodeHintType.TRY_HARDER, true);

  const cv = document.createElement('canvas'), ctx = cv.getContext('2d', { willReadFrequently: true });
  return {
    detect: async v => {
      const vw = v.videoWidth, vh = v.videoHeight; if (!vw) return null;
      // Se analiza la franja central (donde está el recuadro guía)
      const w = Math.min(vw, 960), sc = w / vw, h = Math.round(vh * 0.5 * sc);
      cv.width = w; cv.height = h; ctx.drawImage(v, 0, vh * 0.25, vw, vh * 0.5, 0, 0, w, h);
      const px = ctx.getImageData(0, 0, w, h).data, lum = new Uint8ClampedArray(w * h);
      for (let i = 0, j = 0; i < lum.length; i++, j += 4) lum[i] = (px[j] * 306 + px[j + 1] * 601 + px[j + 2] * 117) >> 10;
      try { return reader.decodeWithState(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.RGBLuminanceSource(lum, w, h)))).getText(); }
      catch (e) { return null; }
    }
  };
}
async function scan(onCode) {
  if (!navigator.mediaDevices?.getUserMedia) return toast('Este navegador no permite usar la cámara. Tipeá el código.', 4500);
  let det;
  try { det = await makeDetector(); }
  catch (e) { return toast('No se pudo cargar el lector de códigos: la primera vez necesita conexión. Por ahora tipeá el código.', 5500); }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }); }
  catch (e) { return toast(e && e.name === 'NotAllowedError' ? 'No hay permiso para usar la cámara. Habilitalo en los ajustes del navegador para este sitio.' : 'No se pudo abrir la cámara (en la vista previa de Claude está bloqueada; publicada funciona). Por ahora tipeá el código.', 6000); }
  const ov = $('#scanOv'), v = $('#scanVideo'); v.srcObject = stream; ov.hidden = false;
  try { await v.play(); } catch (e) {}
  let alive = true;
  const stop = () => { alive = false; stream.getTracks().forEach(t => t.stop()); v.srcObject = null; ov.hidden = true; };
  $('#scanClose').onclick = stop;
  const loop = async () => {
    if (!alive) return;
    let code = null; try { code = await det.detect(v); } catch (e) {}
    if (code && alive) { stop(); try { navigator.vibrate?.(60); } catch (e) {} if (onCode) onCode(code); else { F.ean = code; onEan(true); } return; }
    setTimeout(loop, 120);
  };
  loop();
}
function onEan(force) {

}

  else if (t.dataset.sepaq) { SQ = t.value; const c = $('#sepaRes'); if (c && SUCS) c.innerHTML = sucResHTML(); }
  else if (t.dataset.planq) { PREF.q = t.value; savePref(); const c2 = $('#planList'); if (c2) c2.innerHTML = planListHTML(); }
  else if (t.dataset.prefmulti) { PREF.allowMulti = t.checked; savePref(); renderPlanificar(); }
  else if (t.dataset.q) {
    const k = t.dataset.q; Q[k] = t.value; const c = $('#list-' + k);
    if (c) c.innerHTML = k === 'pres' ? presListHTML() : priceListHTML();

  }
  else if (t.dataset.syncauto) { SYNC.auto = t.checked; saveSync(); }
  else if (t.dataset.sync) { SYNC[t.dataset.sync] = t.value.trim(); if (t.dataset.sync === 'url') { SYNC.last = ''; SYNC.lastOk = ''; SYNC.planilla = ''; } saveSync(); renderSyncBtn(); }
  else if (t.dataset.store) { const st = getStore(t.dataset.store); st.name = t.value; touch(st); save(); renderVisit(); }
  else if (t.dataset.pay) {
    const p = S.pays.find(x => x.id === t.dataset.pay), k = t.dataset.pk;
    if (k === 'name') p.name = t.value; else if (k === 'dev') { const v = parseInt(t.value, 10); p.dev = isNaN(v) ? null : Math.max(0, v); } else if (k === 'tope' || k === 'minimo') { const v = num(t.value); p[k] = v > 0 ? v : null; } else { const v = num(t.value); p[k] = isNaN(v) ? 0 : v; }
    touch(p); save(); renderVisit();
  }
});
document.addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.pref) { PREF.open = d.open; savePref(); } if (d.dataset && d.dataset.more) F.more = d.open; if (d.dataset && d.dataset.sec) d.open ? OPEN.add(d.dataset.sec) : OPEN.delete(d.dataset.sec); }, true);
document.addEventListener('change', e => {
  const t = e.target, a = t.dataset.chg;
  if (t.dataset.catname !== undefined) { const i = +t.dataset.catname, old = S.cats[i], v = t.value.trim(); if (!v || S.cats.some((c, j) => j !== i && fold(c) === fold(v))) { toast('Nombre vacío o repetido'); renderDatos(); return; } S.cats[i] = v; S.prods.forEach(p => { if (p.cat === old) { p.cat = v; touch(p); } }); save(); renderDatos(); return; }
  if (t.id === 'fileImp' && t.files[0]) { t.files[0].text().then(importData); return; }
  if (t.dataset.needpres) { const n = S.need.find(x => x.id === t.dataset.needpres); if (n) { const oldAmt = needAmt(n); n.presId = t.value; n.units = Math.max(1, Math.round(oldAmt / contentOf(getPres(n.presId)))); n.pin = null; save(); renderPlanificar(); } return; }
  if (t.dataset.edsel === 'ptype' && ED) { const v = t.value; ED.d.promo = v === 'nth' ? { t: v, n: 2, v: 50 } : v === 'nxm' ? { t: v, n: 3, m: 2 } : v === 'nfor' ? { t: v, n: 2 } : { t: v }; renderDatos(); return; }
  if (t.dataset.ed === 'base' && ED) { renderDatos(); return; }
  if (t.dataset.ed === 'storeId' && ED) { ED.d.movePick = null; renderDatos(); return; }
  if (t.dataset.store && !t.value.trim()) { toast('La tienda necesita un nombre'); t.value = getStore(t.dataset.store).name = 'Tienda sin nombre'; save(); renderVisit(); return; }
  if (a === 'vstore') { S.visit.storeId = t.value; F.storeId = t.value; save(); lastSaved = null; render(); }
  else if (t.dataset.f === 'fecha' || t.dataset.f === 'hasta') { renderCargar(); }
  else if (t.dataset.ed === 'hasta' && ED) { renderDatos(); }
  else if (a === 'tkstore') { if (TK) { if (t.value) tkmap()[tkStoreKey(TK)] = t.value; else delete tkmap()[tkStoreKey(TK)]; TK.sel = {}; save(); render(); } }
  else if (a === 'tkf') { const it = TK?.items[+t.dataset.i]; if (it) { const v = num(t.value), f = t.dataset.f; if (f === 'q' && v > 0) it.qty = v; if (f === 'u' && v > 0) it.unit = v; if (f === 'q' || f === 'u') it.gross = Math.round(it.qty * it.unit * 100) / 100; if (f === 'd' && v >= 0) { const sd = it.discs[0]; it.discs = v > 0 ? [{ label: sd?.label || 'Descuento', amt: v, pago: !!sd?.pago }] : []; } it.warn = []; TK.sel = {}; tkSums(TK); render(); } }
  else if (a === 'tkrev') { if (TK) { TK.revisado = t.checked; render(); } }
  else if (a === 'tkpay') { if (TK) { tkmap()[tkPayKey(TK)] = t.value; save(); render(); } }
  else if (a === 'tksel') { if (TK) { (TK.sel ||= {})[t.dataset.i] = t.checked; render(); } }
  else if (a === 'tkassoc') { if (TK && t.value) { const it = TK.items[+t.dataset.i], x = getPres(t.value); if (it && x) { if (it.ean && !x.ean && !S.pres.some(o => o.ean === it.ean)) { x.ean = it.ean; touch(x); } else if (it.ean) tkmap()['ean:' + it.ean] = x.id; else tkmap()['plu:' + it.plu] = x.id; save(); render(); toast('Asociado: se recuerda para los próximos tickets'); } } }
  else if (a === 'pcopy') { DV.pcopy = t.checked; SELC.clear(); renderDatos(); }
  else if (a === 'cpysel') { if (t.checked) SELC.add(t.dataset.id); else SELC.delete(t.dataset.id); const c = $('#list-prices'); if (c) c.innerHTML = priceListHTML(); }
  else if (a === 'cpypromo') { if (ED?.copy) ED.copy.promo = t.checked; }
  else if (a === 'pstore') { DV.pstore = t.value; const c = $('#list-prices'); if (c) c.innerHTML = priceListHTML(); }
  else if (a === 'fstore') { F.storeId = t.value; F.setVisit = false; if (F.presId !== 'new') fillFromPres(getPres(F.presId)); renderCargar(); }
  else if (a === 'vpay') { if (!t.value) return; S.visit.payId = t.value; S.visit.payByStore = { ...(S.visit.payByStore || {}), [S.visit.storeId]: t.value }; save(); render(); }
  else if (a === 'fprod') { setLastProd(t.value); const keep = F.presId === 'new' ? { ean: F.ean, marca: F.marca, desc: F.desc, cont: F.cont, unit: F.unit, pack: F.pack, nota: F.nota, look: F.look } : null; resetForm(t.value); if (keep) { Object.assign(F, keep); const pr = getProd(t.value); if (pr && baseOf(pr).units[F.unit] === undefined) F.unit = defUnit(pr); } lastSaved = null; renderCargar(); }
  else if (a === 'fpres') { if (t.value === 'new') resetForm(F.prodId); else fillFromPres(getPres(t.value)); renderCargar(); if (t.value !== 'new') $('#fPrecio')?.focus(); }
});

$('#confDlg').addEventListener('close', () => { if (CONF) { SYNC.conflicts = CONF.list.length; saveSync(); CONF = null; syncing = false; render(); } });
window.addEventListener('online', () => { if (linkedStores().length) loadRefs(); renderVisit(); if (autoOn() && pendientes()) syncNow(true); });
window.addEventListener('offline', () => renderVisit());

try {
  if ('serviceWorker' in navigator && location.protocol === 'https:') {

} catch (e) {}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && autoOn() && pendientes() && (!SYNC.lastOk || Date.now() - new Date(SYNC.lastOk) > 5 * 60000)) syncNow(true); });

if (!S.catsAuto) { S.prods.forEach(p => { if (!p.cat) { const c = suggestCat(p.name); if (c) { p.cat = c; touch(p); } } }); ensureCats(); S.catsAuto = true; save(); }
render();

if (!('BarcodeDetector' in window) && navigator.onLine !== false && location.protocol === 'https:') setTimeout(() => loadZXing().catch(() => {}), 4000);

<!-- ===== Versión (estándar caja de apps) — bloque autónomo =====
     Requiere en el <head>: <meta name="app-version" content="vX.Y.Z">
     y en el encabezado: <button id="verBtn" class="vs-ver" type="button">v—</button>
     (o, si la app ya muestra su propio texto de versión, marcar ese elemento con data-vs-open:
      al tocarlo abre el diálogo y no se le cambia el texto).
     1) El número escrito en el HTML se ve siempre (sin conexión, Apps Script, caché vieja).
     2) Fecha y Changelog desde las Releases de GitHub (sin conexión: última copia guardada).
     3) Si GitHub tiene una versión más alta: aviso "Hay una versión nueva, recargá". -->
<style>
  .vs-ver{border:1px solid #d0d5dd;background:#fff;color:#555;font:600 12px system-ui,sans-serif;padding:3px 10px;border-radius:999px;cursor:pointer;vertical-align:middle}
  .vs-ver.new,[data-vs-open].new{border-color:#d97706;color:#d97706}
  [data-vs-open]{cursor:pointer}
  .vs-upd{display:none;position:sticky;top:0;z-index:9998;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;background:#f59e0b;color:#1c1f26;font:14px system-ui,sans-serif}
  .vs-upd.on{display:flex}
  .vs-upd button,.vs-dlg .vs-acts button,.vs-dlg .vs-acts a{border:1px solid #c9ced6;border-radius:10px;padding:8px 13px;background:#fff;color:#1c1f26;font:14px system-ui,sans-serif;cursor:pointer;text-decoration:none}
  .vs-upd button{border-color:#1c1f26;background:#1c1f26;color:#fff}
  .vs-dlg{border:1px solid #d0d5dd;border-radius:16px;padding:20px;max-width:min(560px,92vw);width:100%;font:15px/1.45 system-ui,sans-serif;color:#1c1f26;background:#fff}
  .vs-dlg h3{margin:0 0 8px}.vs-dlg .vs-mut{color:#6b7280}
  .vs-dlg .vs-rels{max-height:60vh;overflow:auto}
  .vs-dlg .vs-rel{border-top:1px solid #e5e7eb;padding:10px 0}.vs-dlg .vs-rel pre{white-space:pre-wrap;font:inherit;font-size:14px;color:#6b7280;margin:4px 0 0}
  .vs-dlg .vs-acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
  @media print{.vs-ver,.vs-upd,.vs-dlg{display:none!important}}
  .vs-dlg .vs-acts .vs-pri{background:#4f46e5;border-color:#4f46e5;color:#fff}
</style>
<div class="vs-upd" id="vsUpd" role="status"><span id="vsUpdTxt">Hay una versión nueva, recargá.</span><button type="button" id="vsUpdBtn">Recargar</button></div>
<dialog class="vs-dlg" id="vsDlg"></dialog>
<script>
(function(){
  const REPO = "luchorcompartidos/super";                       // usuario/repo de GitHub
  const LOG_FN = "";                   // función propia de Changelog de la app (vacío = usar el de GitHub)
  const KEY  = "vs_rels_" + REPO;
  const APP_VERSION = (document.querySelector('meta[name="app-version"]')||{}).content || "v—";
  const $ = id => document.getElementById(id);
  const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt = s => new Date(s).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  const semv = t => (String(t).replace(/^v/,"").split(".").map(n=>parseInt(n)||0).concat([0,0,0])).slice(0,3);
  const cmpV = (a,b) => { const x=semv(a), y=semv(b); for(let i=0;i<3;i++) if(x[i]!==y[i]) return y[i]-x[i]; return 0; };
  let rels = null; try{ rels = JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
  // Estado de la última consulta a GitHub: así el diálogo distingue "no está publicada" de "no se pudo consultar"
  let relsAt = 0; try{ relsAt = +localStorage.getItem(KEY+"_t") || 0; }catch(e){}
  let lastFail = false, loading = null;
  // Si el diálogo quedó fuera del <body> (bloque pegado al final), lo movemos
  [$("vsUpd"),$("vsDlg")].forEach(el=>{ if(el && el.parentNode!==document.body) document.body.appendChild(el); });
  document.body.insertBefore($("vsUpd"), document.body.firstChild);
  // Dentro de Apps Script la app sale de la copia del script: recargar no alcanza, hay que actualizarlo.
  const GAS = !!(window.google && window.google.script && window.google.script.run);
  const REL_URL = `https://github.com/${REPO}/releases`;
  if(GAS){ const ub=$("vsUpdBtn"); ub.textContent = "Ver Releases"; }
  const ultima = () => rels && rels[0];
  const hayNueva = () => !!(ultima() && APP_VERSION!=="v—" && cmpV(ultima().tag, APP_VERSION) < 0);
  function show(){
    const b = $("verBtn"), n = hayNueva();
    if(b){ b.textContent = APP_VERSION + (n?" ⬆":""); b.classList.toggle("new", n); b.title = n ? "Hay una versión nueva: "+ultima().tag : "Versión"; }
    document.querySelectorAll("[data-vs-open]").forEach(el=>{ el.classList.toggle("new", n); if(n) el.title = "Hay una versión nueva: "+ultima().tag; });
    $("vsUpd").classList.toggle("on", n);
    if(n) $("vsUpdTxt").textContent = GAS ? `Hay una versión nueva (${ultima().tag}): actualizá el script de Apps Script.`
                                          : `Hay una versión nueva (${ultima().tag}), recargá.`;
  }
  function load(){ if(!loading) loading = doLoad().finally(()=>{ loading = null; }); return loading; }
  async function doLoad(){
    try{
      const r = await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=100`,{headers:{Accept:"application/vnd.github+json"},cache:"no-store"});
      if(!r.ok){ lastFail = true; return; }
      lastFail = false; relsAt = Date.now(); try{ localStorage.setItem(KEY+"_t", String(relsAt)); }catch(e){}
      rels = (await r.json()).filter(x=>!x.draft && !x.prerelease).map(x=>{
        const f = (x.assets||[]).map(a=>a.updated_at).filter(Boolean).sort();
        return { tag:x.tag_name, date:f.length?f[f.length-1]:(x.published_at||x.created_at), deArchivo:f.length>0, body:x.body||"" };
      }).sort((a,b)=>cmpV(a.tag,b.tag));
      try{ localStorage.setItem(KEY, JSON.stringify(rels)); }catch(e){}
      show();
    }catch(e){ lastFail = true; }
  }
  function recargar(){ if(GAS){ window.open(REL_URL, "_blank", "noopener"); return; } const u = new URL(location.href); u.searchParams.set("v", Date.now()); location.replace(u); }
  function dlg(html){
    const d = $("vsDlg"); d.innerHTML = html;
    d.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>d.close());
    if(!d.open) d.showModal(); return d;
  }
  let reintento = false;
  function openVer(){
    const r = (rels||[]).find(x=>x.tag===APP_VERSION), n = hayNueva();
    const hace = relsAt ? ` (información de hace ${Math.max(1, Math.round((Date.now()-relsAt)/60000))} min)` : "";
    // Si la lista guardada no tiene esta versión, se vuelve a consultar GitHub antes de concluir nada
    if(!r && !reintento && navigator.onLine !== false){ reintento = true; dlg(`<h3>Versión ${esc(APP_VERSION)}</h3><p class="vs-mut">Consultando GitHub…</p>`); load().then(()=>{ if($("vsDlg").open) openVer(); reintento = false; }); return; }
    const fecha = r ? (r.deArchivo?"Archivos actualizados el ":"Publicada el ")+"<b>"+fmt(r.date)+"</b>"
                    : navigator.onLine === false ? `Sin conexión: no se puede consultar GitHub ahora${rels ? hace : ""}.`
                    : lastFail ? `No se pudo consultar GitHub (puede ser un límite de consultas seguidas). Probá de nuevo en unos minutos${rels ? hace : ""}.`
                    : rels ? "Esta versión todavía no figura en las Releases de GitHub. Se publica unos segundos después de cada entrega: probá de nuevo en un minuto."
                    : "Fecha no disponible (requiere conexión).";
    const d = dlg(`<h3>Versión ${esc(APP_VERSION)}</h3><p class="vs-mut">${fecha}</p>${n?`<p><b>Hay una versión nueva: ${esc(ultima().tag)}.</b>${GAS?" Para usarla, actualizá el script de Apps Script.":""}</p>`:""}
      <div class="vs-acts">${n?`<button class="vs-pri" id="vsRec" type="button">${GAS?"Ver Releases":"↻ Recargar"}</button>`:""}<button ${n?"":'class="vs-pri"'} id="vsLog" type="button">📋 Changelog</button><button data-x type="button">Cerrar</button></div>`);
    d.querySelector("#vsLog").onclick = () => { if(LOG_FN && typeof window[LOG_FN]==="function"){ d.close(); window[LOG_FN](); } else openLog(); };
    const rb = d.querySelector("#vsRec"); if(rb) rb.onclick = recargar;
  }
  function openLog(){
    const list = (rels||[]).map(r=>`<div class="vs-rel"><b>${esc(r.tag)}</b>${r.tag===APP_VERSION?' <span class="vs-mut">(la que estás usando)</span>':""} · <span class="vs-mut">${fmt(r.date)}</span>${r.body?`<pre>${esc(r.body)}</pre>`:""}</div>`).join("");
    dlg(`<h3>Changelog</h3><div class="vs-rels">${list||'<p class="vs-mut">Sin datos todavía (requiere conexión).</p>'}</div>
      <div class="vs-acts"><a href="${REL_URL}" target="_blank" rel="noopener">Ver Releases en GitHub ↗</a><button data-x type="button">Cerrar</button></div>`);
  }
  $("vsDlg").addEventListener("click", e=>{ if(e.target.id==="vsDlg") e.target.close(); });
  if($("verBtn")) $("verBtn").addEventListener("click", openVer);
  document.querySelectorAll("[data-vs-open]").forEach(el=>el.addEventListener("click", openVer));
  window.VS = { abrir: openVer, version: APP_VERSION, hayNueva };
  $("vsUpdBtn").addEventListener("click", recargar);
  show(); load();
  // Se vuelve a consultar al volver a la app, si la información tiene más de 10 minutos
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && Date.now()-relsAt > 600000) load(); });
  window.addEventListener("online", ()=>load());
})();
</script>
<!-- ===== fin bloque Versión ===== -->
