<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-version" content="v0.1.0">
<title>Góndola Comparador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#132033; --muted:#5A6678; --line:#D5DBE2;
  --accent:#1F55E0; --accent-ink:#FFFFFF; --tag:#FFD338; --tag-ink:#231B00;
  --good:#0F7A46; --warn:#9A6200; --bad:#BF3227; --good-bg:#E2F3E9; --warn-bg:#FFF0D2; --bad-bg:#FBE3E0;
  --font-d:"Barlow Condensed","Arial Narrow",sans-serif; --font-b:"Barlow",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  /* layout: app de una columna para celular; contexto de la visita fijo arriba, pestañas abajo, carteles amarillos de precio */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D131B; --surface:#16202B; --ink:#ECF1F7; --muted:#9AA7B8; --line:#2A3746;
  --accent:#7EA4FF; --accent-ink:#0B1530; --good:#45CC88; --warn:#F2B64E; --bad:#FF7B6C;
  --good-bg:#13301F; --warn-bg:#33270F; --bad-bg:#3B1B17; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D131B; --surface:#16202B; --ink:#ECF1F7; --muted:#9AA7B8; --line:#2A3746;
  --accent:#7EA4FF; --accent-ink:#0B1530; --good:#45CC88; --warn:#F2B64E; --bad:#FF7B6C;
  --good-bg:#13301F; --warn-bg:#33270F; --bad-bg:#3B1B17; color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 12px;display:grid;gap:8px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-family:var(--font-d);font-weight:700;font-size:26px;margin:0;letter-spacing:.2px}
.brand .dot{width:12px;height:12px;border-radius:3px;background:var(--tag);display:inline-block;transform:translateY(-2px)}
.ver{font-size:12px;color:var(--muted);margin-left:auto}
.visit{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.visit label{font-size:12px;color:var(--muted);display:grid;gap:3px;font-weight:600}
.vhint{grid-column:1/-1;font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
select,input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:9px 10px;min-height:44px;width:100%}
textarea{min-height:90px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
main{flex:1;padding:14px 16px calc(96px + env(safe-area-inset-bottom));display:grid;gap:14px;align-content:start}
.view{display:grid;gap:14px}
.view[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
h2{font-family:var(--font-d);font-size:22px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.fl{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.fl > input,.fl > select{font-weight:500;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}
.row .grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.w-num{width:110px;flex:none} .w-pack{width:64px;flex:none} .w-unit{width:84px;flex:none}
.price-in{font-family:var(--font-d);font-size:30px;font-weight:700;min-height:58px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 12px;min-height:38px;
  font:600 14px var(--font-b);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn{border:0;border-radius:12px;padding:12px 16px;min-height:48px;font:700 16px var(--font-b);cursor:pointer;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.switch{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
.switch input{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.p-good{background:var(--good-bg);color:var(--good)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)}
.p-neutral{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tag{background:var(--tag);color:var(--tag-ink);border-radius:4px;padding:1px 6px;font-size:12px;font-weight:700;white-space:nowrap}
.preview{background:var(--bg);border-radius:12px;padding:12px;display:grid;gap:8px;font-size:14px}
.pv-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.big{font-family:var(--font-d);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:15px;color:var(--muted);font-weight:600;margin-left:2px}
.verdict{border-radius:14px;padding:14px;display:grid;gap:4px;border:2px solid}
.verdict.good{background:var(--good-bg);border-color:var(--good);color:var(--ink)}
.verdict.warn{background:var(--warn-bg);border-color:var(--warn)}
.verdict.none{background:var(--surface);border-color:var(--line)}
.verdict b.head{font-family:var(--font-d);font-size:21px}
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:10px 12px;
  display:grid;grid-template-columns:1fr auto;gap:6px 10px}
.item.s-good{border-left-color:var(--good)} .item.s-warn{border-left-color:var(--warn)} .item.s-bad{border-left-color:var(--bad)}
.item.here{box-shadow:inset 0 0 0 1px var(--accent)}
.it-title{font-weight:700}
.it-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px}
.it-sub{grid-column:1/-1;font-size:13px;color:var(--muted)}
.it-price{text-align:right;display:grid;gap:3px;justify-items:end;align-content:start}
.it-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}
.store{font-size:12px;font-weight:700;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:600}
.tile .val{font-family:var(--font-d);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.tile.main{background:var(--ink);color:var(--surface);border-color:var(--ink)} .tile.main .lbl{color:inherit;opacity:.8}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:var(--accent)}
.bar.full > i{background:var(--bad)}
table.calc{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.calc td{padding:6px 0;border-bottom:1px solid var(--line)} table.calc td:last-child{text-align:right;font-weight:600}
table.calc tr.total td{font-weight:800;font-size:16px;border-bottom:0}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 18px var(--font-b);cursor:pointer}
.stepper span{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.sec > summary{padding:14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.sec > summary::after{content:"+";color:var(--muted);font-weight:700}
details.sec[open] > summary::after{content:"–"}
details.sec > .body{padding:0 14px 14px;display:grid;gap:10px}
.drow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.drow:last-child{border-bottom:0}
.paybox{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px}
.calc-ex{width:100%;border-collapse:collapse;font-size:13px}
.calc-ex th,.calc-ex td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line)}
.calc-ex td:last-child,.calc-ex th:last-child{text-align:right}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:520px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs a{display:grid;justify-items:center;gap:2px;padding:9px 4px 10px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:700;position:relative}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs a[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{position:absolute;top:4px;left:56%;background:var(--tag);color:var(--tag-ink);border-radius:99px;font-size:11px;padding:0 6px;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(480px,92vw);
  background:var(--ink);color:var(--surface);padding:12px 14px;border-radius:12px;font-size:14px;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.scan{position:fixed;inset:0;background:#000;z-index:30;display:grid;place-items:center}
.scan[hidden]{display:none}
.scan video{width:100%;max-height:80vh;object-fit:cover}
.scan button{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%)}
.result{border:2px solid var(--good);background:var(--good-bg)}
@media (max-width:380px){.tiles{grid-template-columns:1fr 1fr}.tile.main{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){.chip,.btn{transition:background .12s,color .12s}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="dot" aria-hidden="true"></span><h1>Góndola</h1><span class="muted small">comparador de precios</span><span class="ver"><button id="verBtn" class="vs-ver" type="button">v0.1.0</button></span></div>
    <div class="visit">
      <label for="vStore">Estoy en<select id="vStore" data-chg="vstore"></select></label>
      <label for="vPay">Pago con<select id="vPay" data-chg="vpay"></select></label>
      <div class="vhint" id="vHint"></div>
    </div>
  </header>

  <main>
    <section class="view" id="view-cargar"></section>
    <section class="view" id="view-comparar" hidden></section>
    <section class="view" id="view-carrito" hidden></section>
    <section class="view" id="view-datos" hidden></section>
  </main>
</div>

<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <a href="#cargar" data-tab="cargar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Cargar</a>
    <a href="#comparar" data-tab="comparar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 18h4V9H4zM10 18h4V5h-4zM16 18h4v-6h-4z"/></svg>Comparar</a>
    <a href="#carrito" data-tab="carrito"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h10.2L20 8H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg>Carrito<span class="badge" id="cartBadge" hidden></span></a>
    <a href="#datos" data-tab="datos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>Datos</a>
  </div>
</nav>

<div class="toast" id="toast" role="status" hidden></div>
<div class="scan" id="scanOv" hidden><video id="scanVideo" playsinline muted></video><button class="btn primary" id="scanClose">Cerrar cámara</button></div>

<script>
"use strict";
/* ============ utilidades ============ */
const LS = 'gondola.v1';
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const isoOf = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
const todayISO = () => isoOf(new Date());
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return isoOf(d); };
const ageDays = iso => Math.max(0, Math.round((new Date(todayISO()) - new Date(iso)) / 864e5));
const DOW = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const nf0 = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nfx = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 2 });
const money = v => '$ ' + (Math.abs(v) >= 100 ? nf0.format(v) : nf2.format(v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function num(s) {
  if (typeof s === 'number') return s;
  s = String(s ?? '').trim().replace(/\s|\$/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return parseFloat(s);
}
let toastT;
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms); }

/* ============ unidades ============ */
const BASES = {
  kg: { short: 'kg', units: { g: 0.001, kg: 1 }, def: 'g', chips: [[250, 'g'], [500, 'g'], [1, 'kg'], [2, 'kg']] },
  L:  { short: 'L', units: { ml: 0.001, cc: 0.001, L: 1 }, def: 'ml', chips: [[500, 'ml'], [900, 'ml'], [1, 'L'], [1.5, 'L'], [2.25, 'L']] },
  un: { short: 'un', units: { un: 1 }, def: 'un', chips: [[1, 'un'], [6, 'un'], [12, 'un'], [30, 'un']] },
  m:  { short: 'm', units: { m: 1 }, def: 'm', chips: [[30, 'm'], [50, 'm'], [80, 'm']] }
};
const baseOf = prod => BASES[prod?.base] || { short: prod?.base || 'u', units: { [prod?.base || 'u']: 1 }, def: prod?.base || 'u', chips: [] };
const getProd = id => S.prods.find(x => x.id === id);
const getPres = id => S.pres.find(x => x.id === id);
const getPrice = id => S.prices.find(x => x.id === id);
const getStore = id => S.stores.find(x => x.id === id);
const getPay = id => S.pays.find(x => x.id === id) || NOPAY;
const contentOf = pres => { const b = baseOf(getProd(pres.prodId)); return pres.cont * (b.units[pres.unit] ?? 1) * (pres.pack || 1); };
const presLabel = pres => `${pres.marca}${pres.desc ? ' ' + pres.desc : ''} · ${pres.pack > 1 ? pres.pack + ' × ' : ''}${nfx.format(pres.cont)} ${pres.unit}`;

/* ============ motor de promociones ============
   Toda promo se expresa como: "llevando N unidades, el total es T".  */
function promo(p) {
  const P = p.precio, r = p.promo || { t: 'none' };
  switch (r.t) {
    case 'fixed': return { N: 1, total: r.v, label: 'Oferta ' + money(r.v), on: true };
    case 'pct':   return { N: 1, total: P * (1 - r.v / 100), label: r.v + '% off', on: true };
    case 'nth':  { const n = r.n || 2; return { N: n, total: P * (n - 1) + P * (1 - r.v / 100), label: `${n}ª al ${r.v}%`, on: true }; }
    case 'nxm':   return { N: r.n, total: P * r.m, label: `${r.n}x${r.m}`, on: true };
    case 'nfor':  return { N: r.n, total: r.v, label: `${r.n} por ${money(r.v)}`, on: true };
    default:      return { N: 1, total: P, label: '', on: false };
  }
}
const NOPAY = { id: 'none', name: 'Sin descuento', pct: 0 };
function payRate(pay, storeId) {
  if (!pay || pay.id === 'none') return 0;
  if (pay.stores?.length && !pay.stores.includes(storeId)) return 0;
  if (pay.dias?.length && !pay.dias.includes(new Date().getDay())) return 0;
  return (pay.pct || 0) / 100;
}
/* Precio efectivo por unidad base, para "llevando 1" y "llevando N" */
function calc(p, pay, pres = getPres(p.presId)) {
  const C = contentOf(pres), d = payRate(pay, p.storeId), pr = promo(p);
  let one;
  if (pr.on && pr.N === 1) one = { total: pr.total * (p.acum ? 1 - d : 1), payOn: !!p.acum && d > 0, promoOn: true };
  else one = { total: p.precio * (1 - d), payOn: d > 0, promoOn: false };
  one.per = one.total / C;
  let many = null;
  if (pr.N > 1) { many = { total: pr.total * (p.acum ? 1 - d : 1), payOn: !!p.acum && d > 0, promoOn: true }; many.per = many.total / (pr.N * C); }
  const best = many && many.per < one.per - 1e-9 ? { ...many, N: pr.N } : { ...one, N: 1 };
  return { one, many, best, pr, d, C, lista: p.precio / C, pay };
}
function bestPay(p) {
  let bc = calc(p, NOPAY);
  for (const pay of S.pays) { const c = calc(p, pay); if (c.best.per < bc.best.per - 1e-9) bc = c; }
  return bc;
}
function rowsFor(prodId, mode) {
  const vpay = getPay(S.visit.payId);
  return S.prices.filter(p => getPres(p.presId)?.prodId === prodId && getStore(p.storeId))
    .map(p => ({ p, pres: getPres(p.presId), c: mode === 'best' ? bestPay(p) : calc(p, vpay) }))
    .sort((a, b) => a.c.best.per - b.c.best.per);
}

/* ============ datos de ejemplo ============ */
function seed() {
  const dow = new Date().getDay();
  const s1 = 's1', s2 = 's2';
  const D = {
    ver: 1, demo: true,
    stores: [{ id: s1, name: 'Súper Norte · Palermo' }, { id: s2, name: 'Híper Sur · Avellaneda' }],
    pays: [
      { id: 'p1', name: 'Banco Azul crédito', pct: 20, tope: 15000, usado: 13500, dias: [dow, (dow + 1) % 7], stores: [s1], modo: 'caja' },
      { id: 'p2', name: 'Billetera Celeste', pct: 10, tope: null, usado: 0, dias: [], stores: [], modo: 'reintegro' },
      { id: 'p3', name: 'Banco Rojo débito', pct: 25, tope: 10000, usado: 0, dias: [(dow + 2) % 7], stores: [s2], modo: 'reintegro' }
    ],
    prods: [
      { id: 'ac', name: 'Aceite de girasol', base: 'L' }, { id: 'ye', name: 'Yerba mate', base: 'kg' },
      { id: 'ph', name: 'Papel higiénico', base: 'm' }, { id: 'le', name: 'Leche entera', base: 'L' }
    ],
    pres: [], prices: [], visit: { storeId: s1, payId: 'p1' }, cart: []
  };
  const P = (id, prodId, marca, desc, cont, unit, pack, ean) => D.pres.push({ id, prodId, marca, desc, cont, unit, pack, ean });

      <div class="it-sub">Góndola ${money(p.precio)} · ${payTxt}${alt ? ' · ' + alt : ''}${p.hist?.length ? ` · antes ${money(p.hist[p.hist.length - 1].precio)} (${ageTxt(p.hist[p.hist.length - 1].fecha)})` : ''}</div>
      ${isHere ? `<div class="it-actions"><button class="btn sm" data-act="addcart" data-id="${p.id}" data-q="${c.best.N}">+ Carrito (${c.best.N})</button></div>` : ''}
    </article>`;
  }).join('') + `</div>`;
  const herePres = new Set(S.prices.filter(p => p.storeId === here).map(p => p.presId));
  const missing = S.pres.filter(x => x.prodId === prod.id && !herePres.has(x.id));
  if (missing.length) h += `<div class="card"><h3>Sin precio en ${esc(getStore(here).name)}</h3><div class="small muted">Ya las conocés de otra tienda: solo falta tipear el precio de acá.</div>
    ${missing.map(x => `<div class="drow"><span>${esc(presLabel(x))}</span><button class="btn sm" data-act="loadpres" data-id="${x.id}">Cargar</button></div>`).join('')}</div>`;
  h += `<button class="btn ghost block" data-act="loadnew" data-id="${prod.id}">+ Cargar otra presentación de ${esc(prod.name)}</button>`;
  el.innerHTML = h;
}

/* ============ vista CARRITO ============ */
function cartCalc() {
  const sid = S.visit.storeId, pay = getPay(S.visit.payId), d = payRate(pay, sid);
  let lista = 0, promoSave = 0, base = 0; const items = [];
  for (const it of S.cart) {
    const p = getPrice(it.priceId); if (!p || p.storeId !== sid || !getPres(p.presId)) continue;
    const pr = promo(p), q = it.qty;
    const groups = pr.on ? Math.floor(q / pr.N) : 0, rem = q - groups * pr.N;
    const promoPart = groups * pr.total, remPart = rem * p.precio, sub = promoPart + remPart;
    lista += q * p.precio; promoSave += q * p.precio - sub; base += remPart + (p.acum ? promoPart : 0);
    let hint = '';
    if (pr.on && pr.N > 1 && rem > 0) {
      const add = pr.N - rem, extra = pr.total - rem * p.precio;
      hint = extra <= 0.5 ? `Sumando ${add} más pagás lo mismo` : `Sumando ${add} más completás la promo: +${money(extra)}`;
    }
    items.push({ it, p, pr, groups, rem, sub, hint });
  }
  const raw = base * d;
  const rest = pay.id !== 'none' && pay.tope ? Math.max(0, pay.tope - (pay.usado || 0)) : Infinity;
  const desc = Math.min(raw, rest);
  const neto = lista - promoSave;
  return { items, lista, promoSave, base, d, raw, desc, rest, capped: raw > rest + 0.5, pay, neto, caja: neto - (pay.modo === 'reintegro' ? 0 : desc), final: neto - desc };
}

  const ahorro = k.promoSave + k.desc;
  let h = `<div class="tiles"><div class="tile main"><span class="lbl">Pagás en caja</span><span class="val">${money(k.caja)}</span></div>
    <div class="tile"><span class="lbl">Ahorro total</span><span class="val" style="color:var(--good)">${money(ahorro)}</span></div>
    <div class="tile"><span class="lbl">Costo final</span><span class="val">${money(k.final)}</span></div></div>`;
  if (k.pay.id !== 'none' && k.pay.tope && k.d > 0) {
    const used = (k.pay.usado || 0) + k.desc, pct = Math.min(100, used / k.pay.tope * 100);
    h += `<div class="card"><div class="pv-row"><h3>Tope ${esc(k.pay.name)}</h3><span class="small">${money(used)} de ${money(k.pay.tope)}</span></div>

  }
  h += `<div class="list">` + k.items.map(x => `<article class="item">
      <div><div class="it-title">${esc(presLabel(getPres(x.p.presId)))}</div>
      <div class="it-meta">${x.pr.on ? `<span class="tag">${esc(x.pr.label)}</span>` : ''}<span class="small muted">${money(x.p.precio)} c/u</span></div></div>
      <div class="it-price"><div class="big" style="font-size:22px">${money(x.sub)}</div>${x.pr.on && x.pr.N > 1 ? `<span class="small muted">${x.groups} promo${x.groups === 1 ? '' : 's'}${x.rem ? ` + ${x.rem} suelta${x.rem === 1 ? '' : 's'}` : ''}</span>` : ''}</div>
      <div class="it-actions" style="justify-content:space-between;align-items:center">${x.hint ? `<span class="pill p-warn">${esc(x.hint)}</span>` : '<span></span>'}
        <div class="stepper"><button aria-label="Quitar uno" data-act="qty" data-id="${x.p.id}" data-d="-1">−</button><span>${x.it.qty}</span><button aria-label="Sumar uno" data-act="qty" data-id="${x.p.id}" data-d="1">+</button></div></div>
    </article>`).join('') + `</div>`;
  h += `<div class="card"><h3>Detalle del cálculo</h3><table class="calc">
    <tr><td>Subtotal a precio de góndola</td><td>${money(k.lista)}</td></tr>
    <tr><td>Ahorro por promos de la tienda</td><td>− ${money(k.promoSave)}</td></tr>
    <tr><td>Base para el descuento de pago<br><span class="small muted">sin productos en promo, salvo los acumulables</span></td><td>${money(k.base)}</td></tr>
    <tr><td>${esc(k.pay.name)} ${k.d > 0 ? k.pay.pct + '%' : '(no aplica)'}${k.capped ? ' · con tope' : ''}${k.pay.modo === 'reintegro' && k.desc ? '<br><span class="small muted">llega como reintegro posterior</span>' : ''}</td><td>− ${money(k.desc)}</td></tr>

  el.innerHTML = h;

/* ============ navegación ============ */
const VIEWS = ['cargar', 'comparar', 'carrito', 'datos'];
const R = { cargar: renderCargar, comparar: renderComparar, carrito: renderCarrito, datos: renderDatos };
const cur = () => { const v = location.hash.slice(1); return VIEWS.includes(v) ? v : 'cargar'; };
function render() {
  renderVisit(); const v = cur();
  VIEWS.forEach(x => { $('#view-' + x).hidden = x !== v; });
  document.querySelectorAll('nav.tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.tab === v ? 'page' : 'false'));
  R[v]();
}
function go(v) { if (cur() === v) render(); else location.hash = v; window.scrollTo(0, 0); }
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

const ACT = {

  pset: el => { Object.assign(F.promo, JSON.parse(el.dataset.set)); renderCargar(); },
  chipc: el => { F.cont = nfx.format(+el.dataset.v); F.unit = el.dataset.u; renderCargar(); $('#fPrecio')?.focus(); },
  save: () => {
    const t = buildTemp(); if (t.err) return toast(t.err);
    let pres = F.presId !== 'new' ? getPres(F.presId) : S.pres.find(x => x.prodId === t.pres.prodId && x.marca.toLowerCase() === t.pres.marca.toLowerCase() && (x.desc || '').toLowerCase() === t.pres.desc.toLowerCase() && x.cont === t.pres.cont && x.unit === t.pres.unit && x.pack === t.pres.pack);
    if (!pres) { pres = { ...t.pres, id: uid() }; S.pres.push(pres); } else Object.assign(pres, { ...t.pres, id: pres.id, ean: t.pres.ean || pres.ean });
    let price = S.prices.find(x => x.presId === pres.id && x.storeId === S.visit.storeId);
    const np = { ...t.price, presId: pres.id };
    if (price) { const hist = [...(price.hist || []), { precio: price.precio, fecha: price.fecha }].slice(-12); Object.assign(price, np, { id: price.id, hist }); }
    else { price = { ...np, id: uid(), hist: [] }; S.prices.push(price); }
    save(); lastSaved = price.id; CMP.prodId = pres.prodId; resetForm(pres.prodId); render(); window.scrollTo(0, 0);
  },
  dismiss: () => { lastSaved = null; renderCargar(); $('#fEan')?.focus(); },
  gocmp: el => { CMP.prodId = el.dataset.id; lastSaved = null; go('comparar'); },
  cprod: el => { CMP.prodId = el.dataset.id; renderComparar(); },
  cmode: el => { CMP.mode = el.dataset.m; renderComparar(); },
  addcart: el => { const id = el.dataset.id, q = +el.dataset.q || 1; const it = S.cart.find(x => x.priceId === id); if (it) it.qty += q; else S.cart.push({ priceId: id, qty: q }); save(); renderVisit(); toast(`Agregado al carrito (${q})`); },
  qty: el => { const it = S.cart.find(x => x.priceId === el.dataset.id); if (!it) return; it.qty += +el.dataset.d; if (it.qty <= 0) S.cart = S.cart.filter(x => x !== it); save(); render(); },
  clearcart: () => { S.cart = S.cart.filter(it => getPrice(it.priceId)?.storeId !== S.visit.storeId); save(); render(); },
  closevisit: () => { const k = cartCalc(); if (k.pay.id !== 'none' && k.desc > 0) { const p = S.pays.find(x => x.id === k.pay.id); p.usado = (p.usado || 0) + k.desc; } ACT.clearcart(); toast('Visita cerrada. Se sumó el descuento al tope usado.'); },
  loadpres: el => { const pres = getPres(el.dataset.id); resetForm(pres.prodId); fillFromPres(pres); lastSaved = null; go('cargar'); setTimeout(() => $('#fPrecio')?.focus(), 50); },
  loadnew: el => { resetForm(el.dataset.id); lastSaved = null; go('cargar'); },
  createprod: () => createProd(true), createprod2: () => createProd(false),
  scan: () => scan(),
  addpay: () => { S.pays.push({ id: uid(), name: 'Nuevo medio', pct: 10, tope: null, usado: 0, dias: [], stores: [], modo: 'caja' }); save(); render(); },
  delpay: el => { S.pays = S.pays.filter(p => p.id !== el.dataset.id); if (S.visit.payId === el.dataset.id) S.visit.payId = 'none'; save(); render(); },
  payreset: el => { S.pays.find(p => p.id === el.dataset.id).usado = 0; save(); render(); },
  paydia: el => { const p = S.pays.find(x => x.id === el.dataset.id), v = +el.dataset.v; p.dias = p.dias?.includes(v) ? p.dias.filter(x => x !== v) : [...(p.dias || []), v].sort(); save(); render(); },
  paystore: el => { const p = S.pays.find(x => x.id === el.dataset.id), v = el.dataset.v; p.stores = p.stores?.includes(v) ? p.stores.filter(x => x !== v) : [...(p.stores || []), v]; save(); render(); },
  paymodo: el => { S.pays.find(x => x.id === el.dataset.id).modo = el.dataset.v; save(); render(); },
  addstore: () => { const v = $('#newStore').value.trim(); if (!v) return toast('Escribí el nombre de la tienda'); S.stores.push({ id: uid(), name: v }); save(); render(); },
  delstore: el => { const id = el.dataset.id; S.stores = S.stores.filter(s => s.id !== id); S.prices = S.prices.filter(p => p.storeId !== id); S.pays.forEach(p => p.stores = (p.stores || []).filter(x => x !== id)); save(); render(); },
  delprod: el => { const id = el.dataset.id; const pr = new Set(S.pres.filter(x => x.prodId === id).map(x => x.id)); S.prods = S.prods.filter(p => p.id !== id); S.pres = S.pres.filter(x => !pr.has(x.id)); S.prices = S.prices.filter(p => !pr.has(p.presId)); if (F.prodId === id) resetForm(S.prods[0]?.id ?? '__new'); save(); render(); },
  delprice: el => { S.prices = S.prices.filter(p => p.id !== el.dataset.id); S.cart = S.cart.filter(x => x.priceId !== el.dataset.id); save(); render(); },
  copyjson: () => { const txt = JSON.stringify(S); const box = $('#jsonBox'); box.value = txt; try { navigator.clipboard.writeText(txt).then(() => toast('Respaldo copiado'), () => { box.select(); toast('Seleccioná y copiá el texto del cuadro'); }); } catch (e) { box.select(); toast('Seleccioná y copiá el texto del cuadro'); } },
  importjson: () => importData($('#jsonBox').value),
  reseed: () => { S = seed(); resetForm(S.prods[0].id); CMP.prodId = S.prods[0].id; save(); render(); toast('Datos de ejemplo restaurados'); },
  wipe: () => { S = { ver: 1, demo: false, stores: [{ id: uid(), name: 'Mi súper' }], pays: [], prods: [], pres: [], prices: [], visit: { storeId: null, payId: 'none' }, cart: [] }; S.visit.storeId = S.stores[0].id; resetForm('__new'); save(); render(); toast('Datos borrados'); }
};
function createProd(toForm) {
  const name = (NP.name || '').trim(); if (!name) return toast('Poné un nombre genérico');
  const base = NP.base === 'otro' ? (NP.custom || '').trim() : NP.base; if (!base) return toast('Indicá la unidad de comparación');
  const p = { id: uid(), name, base }; S.prods.push(p); NP = { name: '', base: 'kg', custom: '' }; save();
  if (toForm) resetForm(p.id); render(); toast('Producto creado');
}
function importData(txt) {
  try { const d = JSON.parse(txt); if (!d.stores || !d.prices || !d.prods) throw 0; S = d; S.demo = !!d.demo; resetForm(S.prods[0]?.id ?? '__new'); save(); render(); toast('Respaldo importado'); }
  catch (e) { toast('Ese texto no es un respaldo válido de Góndola'); }
}
async function scan() {
  if (!('BarcodeDetector' in window)) return toast('Este navegador no trae lector de códigos. En la versión publicada se suma una librería (necesaria en iPhone). Por ahora tipeá el código.', 5000);
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); }
  catch (e) { return toast('No se pudo abrir la cámara: en esta vista previa está bloqueada. Funciona al publicar la app en GitHub Pages. Por ahora tipeá el código.', 5500); }
  const ov = $('#scanOv'), v = $('#scanVideo'); v.srcObject = stream; ov.hidden = false; try { await v.play(); } catch (e) {}
  const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] }); let alive = true;
  const stop = () => { alive = false; stream.getTracks().forEach(t => t.stop()); ov.hidden = true; };
  $('#scanClose').onclick = stop;
  const loop = async () => {
    if (!alive) return;
    try { const r = await det.detect(v); if (r.length) { stop(); F.ean = r[0].rawValue; onEan(true); return; } } catch (e) {}
    setTimeout(loop, 180);
  };
  loop();
}
function onEan(force) {
  const code = (F.ean || '').trim(); if (code.length < 8) return;
  const pres = S.pres.find(x => x.ean === code);
  if (pres && pres.id !== F.presId) { fillFromPres(pres); renderCargar(); toast('Reconocido: ' + presLabel(pres)); $('#fPrecio')?.focus(); }
  else if (force) { renderCargar(); toast('Código leído: es un producto nuevo, completá los datos'); }
}

/* confirmación en dos toques (sin diálogos del navegador) */

  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.confirm) {
    if (!el.dataset.armed || Date.now() - +el.dataset.armed > 3500) { el.dataset.armed = Date.now(); el.dataset.label = el.textContent; el.textContent = 'Tocá de nuevo para confirmar'; setTimeout(() => { if (el.isConnected && el.dataset.armed) { el.textContent = el.dataset.label; delete el.dataset.armed; } }, 3500); return; }
    delete el.dataset.armed;
  }
  ACT[el.dataset.act]?.(el, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f) { F[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value; if (t.dataset.f === 'ean') onEan(); updatePreview(); }
  else if (t.dataset.pf) { F.promo[t.dataset.pf] = t.value; updatePreview(); }
  else if (t.dataset.np) { NP[t.dataset.np] = t.value; }
  else if (t.dataset.pay) {
    const p = S.pays.find(x => x.id === t.dataset.pay), k = t.dataset.pk;
    if (k === 'name') p.name = t.value; else if (k === 'tope') { const v = num(t.value); p.tope = v > 0 ? v : null; } else { const v = num(t.value); p[k] = isNaN(v) ? 0 : v; }
    save(); renderVisit();
  }
});
document.addEventListener('change', e => {
  const t = e.target, a = t.dataset.chg;
  if (t.id === 'fileImp' && t.files[0]) { t.files[0].text().then(importData); return; }
  if (a === 'vstore') { S.visit.storeId = t.value; save(); lastSaved = null; render(); }
  else if (a === 'vpay') { S.visit.payId = t.value; save(); render(); }
  else if (a === 'fprod') { resetForm(t.value); lastSaved = null; renderCargar(); }
  else if (a === 'fpres') { if (t.value === 'new') resetForm(F.prodId); else fillFromPres(getPres(t.value)); renderCargar(); if (t.value !== 'new') $('#fPrecio')?.focus(); }
});

render();
try { if (S.demo && !sessionStorage.getItem('gondola.hi')) { sessionStorage.setItem('gondola.hi', '1'); toast('Cargué datos de ejemplo para que veas cómo funciona.', 3500); } } catch (e) {}
</script>
<!-- ===== Versión (estándar caja de apps) — bloque autónomo =====
     Requiere en el <head>: <meta name="app-version" content="vX.Y.Z">
     y en el encabezado: <button id="verBtn" class="vs-ver" type="button">v—</button>
     (o, si la app ya muestra su propio texto de versión, marcar ese elemento con data-vs-open:
      al tocarlo abre el diálogo y no se le cambia el texto).
     1) El número escrito en el HTML se ve siempre (sin conexión, Apps Script, caché vieja).
     2) Fecha y Changelog desde las Releases de GitHub (sin conexión: última copia guardada).
     3) Si GitHub tiene una versión más alta: aviso "Hay una versión nueva, recargá". -->
<style>
  .vs-ver{border:1px solid #d0d5dd;background:#fff;color:#555;font:600 12px system-ui,sans-serif;padding:3px 10px;border-radius:999px;cursor:pointer;vertical-align:middle}
  .vs-ver.new,[data-vs-open].new{border-color:#d97706;color:#d97706}
  [data-vs-open]{cursor:pointer}
  .vs-upd{display:none;position:sticky;top:0;z-index:9998;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;background:#f59e0b;color:#1c1f26;font:14px system-ui,sans-serif}
  .vs-upd.on{display:flex}
  .vs-upd button,.vs-dlg .vs-acts button,.vs-dlg .vs-acts a{border:1px solid #c9ced6;border-radius:10px;padding:8px 13px;background:#fff;color:#1c1f26;font:14px system-ui,sans-serif;cursor:pointer;text-decoration:none}
  .vs-upd button{border-color:#1c1f26;background:#1c1f26;color:#fff}
  .vs-dlg{border:1px solid #d0d5dd;border-radius:16px;padding:20px;max-width:min(560px,92vw);width:100%;font:15px/1.45 system-ui,sans-serif;color:#1c1f26;background:#fff}
  .vs-dlg h3{margin:0 0 8px}.vs-dlg .vs-mut{color:#6b7280}
  .vs-dlg .vs-rels{max-height:60vh;overflow:auto}
  .vs-dlg .vs-rel{border-top:1px solid #e5e7eb;padding:10px 0}.vs-dlg .vs-rel pre{white-space:pre-wrap;font:inherit;font-size:14px;color:#6b7280;margin:4px 0 0}
  .vs-dlg .vs-acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
  @media print{.vs-ver,.vs-upd,.vs-dlg{display:none!important}}
  .vs-dlg .vs-acts .vs-pri{background:#4f46e5;border-color:#4f46e5;color:#fff}
</style>
<div class="vs-upd" id="vsUpd" role="status"><span id="vsUpdTxt">Hay una versión nueva, recargá.</span><button type="button" id="vsUpdBtn">Recargar</button></div>
<dialog class="vs-dlg" id="vsDlg"></dialog>
<script>
(function(){
  const REPO = "luchorcompartidos/super";                       // usuario/repo de GitHub
  const LOG_FN = "";                   // función propia de Changelog de la app (vacío = usar el de GitHub)
  const KEY  = "vs_rels_" + REPO;
  const APP_VERSION = (document.querySelector('meta[name="app-version"]')||{}).content || "v—";
  const $ = id => document.getElementById(id);
  const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt = s => new Date(s).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  const semv = t => (String(t).replace(/^v/,"").split(".").map(n=>parseInt(n)||0).concat([0,0,0])).slice(0,3);
  const cmpV = (a,b) => { const x=semv(a), y=semv(b); for(let i=0;i<3;i++) if(x[i]!==y[i]) return y[i]-x[i]; return 0; };
  let rels = null; try{ rels = JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
  // Si el diálogo quedó fuera del <body> (bloque pegado al final), lo movemos
  [$("vsUpd"),$("vsDlg")].forEach(el=>{ if(el && el.parentNode!==document.body) document.body.appendChild(el); });
  document.body.insertBefore($("vsUpd"), document.body.firstChild);
  // Dentro de Apps Script la app sale de la copia del script: recargar no alcanza, hay que actualizarlo.
  const GAS = !!(window.google && window.google.script && window.google.script.run);
  const REL_URL = `https://github.com/${REPO}/releases`;
  if(GAS){ const ub=$("vsUpdBtn"); ub.textContent = "Ver Releases"; }
  const ultima = () => rels && rels[0];
  const hayNueva = () => !!(ultima() && APP_VERSION!=="v—" && cmpV(ultima().tag, APP_VERSION) < 0);
  function show(){
    const b = $("verBtn"), n = hayNueva();
    if(b){ b.textContent = APP_VERSION + (n?" ⬆":""); b.classList.toggle("new", n); b.title = n ? "Hay una versión nueva: "+ultima().tag : "Versión"; }
    document.querySelectorAll("[data-vs-open]").forEach(el=>{ el.classList.toggle("new", n); if(n) el.title = "Hay una versión nueva: "+ultima().tag; });
    $("vsUpd").classList.toggle("on", n);
    if(n) $("vsUpdTxt").textContent = GAS ? `Hay una versión nueva (${ultima().tag}): actualizá el script de Apps Script.`
                                          : `Hay una versión nueva (${ultima().tag}), recargá.`;
  }
  async function load(){
    try{
      const r = await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=100`,{headers:{Accept:"application/vnd.github+json"},cache:"no-store"});
      if(!r.ok) return;
      rels = (await r.json()).filter(x=>!x.draft && !x.prerelease).map(x=>{
        const f = (x.assets||[]).map(a=>a.updated_at).filter(Boolean).sort();
        return { tag:x.tag_name, date:f.length?f[f.length-1]:(x.published_at||x.created_at), deArchivo:f.length>0, body:x.body||"" };
      }).sort((a,b)=>cmpV(a.tag,b.tag));
      try{ localStorage.setItem(KEY, JSON.stringify(rels)); }catch(e){}
      show();
    }catch(e){}
  }
  function recargar(){ if(GAS){ window.open(REL_URL, "_blank", "noopener"); return; } const u = new URL(location.href); u.searchParams.set("v", Date.now()); location.replace(u); }
  function dlg(html){
    const d = $("vsDlg"); d.innerHTML = html;
    d.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>d.close());
    if(!d.open) d.showModal(); return d;
  }
  function openVer(){
    const r = (rels||[]).find(x=>x.tag===APP_VERSION), n = hayNueva();
    const fecha = r ? (r.deArchivo?"Archivos actualizados el ":"Publicada el ")+"<b>"+fmt(r.date)+"</b>"
                    : rels ? "Esta versión todavía no figura en las Releases de GitHub." : "Fecha no disponible (requiere conexión).";
    const d = dlg(`<h3>Versión ${esc(APP_VERSION)}</h3><p class="vs-mut">${fecha}</p>${n?`<p><b>Hay una versión nueva: ${esc(ultima().tag)}.</b>${GAS?" Para usarla, actualizá el script de Apps Script.":""}</p>`:""}
      <div class="vs-acts">${n?`<button class="vs-pri" id="vsRec" type="button">${GAS?"Ver Releases":"↻ Recargar"}</button>`:""}<button ${n?"":'class="vs-pri"'} id="vsLog" type="button">📋 Changelog</button><button data-x type="button">Cerrar</button></div>`);
    d.querySelector("#vsLog").onclick = () => { if(LOG_FN && typeof window[LOG_FN]==="function"){ d.close(); window[LOG_FN](); } else openLog(); };
    const rb = d.querySelector("#vsRec"); if(rb) rb.onclick = recargar;
  }
  function openLog(){
    const list = (rels||[]).map(r=>`<div class="vs-rel"><b>${esc(r.tag)}</b>${r.tag===APP_VERSION?' <span class="vs-mut">(la que estás usando)</span>':""} · <span class="vs-mut">${fmt(r.date)}</span>${r.body?`<pre>${esc(r.body)}</pre>`:""}</div>`).join("");
    dlg(`<h3>Changelog</h3><div class="vs-rels">${list||'<p class="vs-mut">Sin datos todavía (requiere conexión).</p>'}</div>
      <div class="vs-acts"><a href="${REL_URL}" target="_blank" rel="noopener">Ver Releases en GitHub ↗</a><button data-x type="button">Cerrar</button></div>`);
  }
  $("vsDlg").addEventListener("click", e=>{ if(e.target.id==="vsDlg") e.target.close(); });
  if($("verBtn")) $("verBtn").addEventListener("click", openVer);
  document.querySelectorAll("[data-vs-open]").forEach(el=>el.addEventListener("click", openVer));
  window.VS = { abrir: openVer, version: APP_VERSION, hayNueva };
  $("vsUpdBtn").addEventListener("click", recargar);
  show(); load();
})();
</script>
<!-- ===== fin bloque Versión ===== -->

</body>
</html>
